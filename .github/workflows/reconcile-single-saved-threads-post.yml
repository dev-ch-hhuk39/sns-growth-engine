name: Reconcile One Saved Threads Result (Manual)

# Explicitly scoped to the one historical queue with a verified saved
# POSTED result. This is never scheduled, never republishes to Threads,
# and never creates, duplicates, or rewrites a posted_results record.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify-only is read-only; apply-verified-repair updates this exact queue after independent provider GET"
        type: choice
        required: true
        default: verify-only
        options: [verify-only, apply-verified-repair]
      confirmation:
        description: "For apply only: type RECONCILE_ONE_POSTED_RESULT"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sns-growth-production-liver-manager-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  reconcile-one-saved-result:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      EXPECTED_QUEUE_ID: q_liver_manager_fallback_20260915140951_1_threads
      ACCOUNT_ID: liver_manager
      REPAIR_MODE: ${{ inputs.mode }}
      REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Guard exact scope and manual confirmation
        shell: bash
        run: |
          set -euo pipefail
          case "$REPAIR_MODE" in
            verify-only) ;;
            apply-verified-repair)
              test "$REPAIR_CONFIRMATION" = "RECONCILE_ONE_POSTED_RESULT" || {
                echo "[BLOCKED] exact confirmation required for one queue-only update"
                exit 2
              }
              ;;
            *)
              echo "[BLOCKED] unsupported repair mode"
              exit 2
              ;;
          esac
          test -n "${SPREADSHEET_ID:-}${SNS_MASTER_SHEET_ID:-}" || {
            echo "[BLOCKED] Sheets spreadsheet is not configured"
            exit 2
          }
          test -n "${GCP_SA_JSON_BASE64:-}${SA_JSON_BASE64:-}" || {
            echo "[BLOCKED] Sheets service account is not configured"
            exit 2
          }
          test -n "${THREADS_ACCESS_TOKEN_LIVER_MANAGER:-}" || {
            echo "[BLOCKED] verified Threads GET credentials unavailable"
            exit 2
          }
          test -n "${THREADS_USER_ID_LIVER_MANAGER:-}" || {
            echo "[BLOCKED] verified Threads account identity unavailable"
            exit 2
          }
          echo "repair_scope=one_saved_result queue=liver_manager mode=$REPAIR_MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install verified runtime dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Read-only saved result and authenticated Threads GET proof
        run: |
          python3 scripts/recover_orphan_threads_post.py \
            --account-id "$ACCOUNT_ID" \
            --queue-id "$EXPECTED_QUEUE_ID" \
            --reconcile-saved-result-queue
      - name: Apply exact queue-only reconciliation after proof
        if: inputs.mode == 'apply-verified-repair' && inputs.confirmation == 'RECONCILE_ONE_POSTED_RESULT'
        run: |
          python3 scripts/recover_orphan_threads_post.py \
            --account-id "$ACCOUNT_ID" \
            --queue-id "$EXPECTED_QUEUE_ID" \
            --reconcile-saved-result-queue --apply
          echo "saved_result_queue_reconciliation=READ_AFTER_WRITE_VERIFIED" >> "$GITHUB_STEP_SUMMARY"
