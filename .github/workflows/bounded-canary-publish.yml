name: Bounded Twelve Canary Publish

on:
  workflow_dispatch:
    inputs:
      confirm_canary_publish:
        description: "Type the exact approval phrase for the selected scope"
        required: true
        default: ""
      canary_wave:
        description: "Approved canary scope"
        required: true
        type: choice
        options:
          - first_wave
          - first_wave_images
          - remaining_eight
          - remaining_seven_recovery
          - all_12
        default: all_12
      canary_batch_id:
        description: "Exact batch id required for remaining_eight"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: bounded-twelve-canary-publish
  cancel-in-progress: false

env:
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT }}
      THREADS_APP_ID_NIGHT_SCOUT: ${{ secrets.THREADS_APP_ID_NIGHT_SCOUT }}
      THREADS_APP_SECRET_NIGHT_SCOUT: ${{ secrets.THREADS_APP_SECRET_NIGHT_SCOUT }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}
      THREADS_APP_ID_LIVER_MANAGER: ${{ secrets.THREADS_APP_ID_LIVER_MANAGER }}
      THREADS_APP_SECRET_LIVER_MANAGER: ${{ secrets.THREADS_APP_SECRET_LIVER_MANAGER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Guard exact authorization and disabled surfaces
        run: |
          if [ "${{ inputs.canary_wave }}" = "first_wave" ]; then
            test "${{ inputs.confirm_canary_publish }}" = "PUBLISH_FIRST_WAVE_APPROVED_CANARIES"
          elif [ "${{ inputs.canary_wave }}" = "first_wave_images" ]; then
            test "${{ inputs.confirm_canary_publish }}" = "PUBLISH_REMAINING_FIRST_WAVE_IMAGES"
          elif [ "${{ inputs.canary_wave }}" = "remaining_eight" ]; then
            test "${{ inputs.confirm_canary_publish }}" = "PUBLISH_APPROVED_REMAINING_EIGHT"
            test -n "${{ inputs.canary_batch_id }}"
          elif [ "${{ inputs.canary_wave }}" = "remaining_seven_recovery" ]; then
            test "${{ inputs.confirm_canary_publish }}" = "PUBLISH_APPROVED_REMAINING_SEVEN_RECOVERY"
            test -n "${{ inputs.canary_batch_id }}"
          else
            test "${{ inputs.confirm_canary_publish }}" = "PUBLISH_12_APPROVED_CANARIES"
          fi
          test "$ALLOW_REAL_X_POST" = "false"
          test "$ALLOW_VIDEO_DOWNLOAD" = "false"
          test "$ALLOW_VIDEO_CUT" = "false"
          test "$ALLOW_CLOUDINARY_UPLOAD" = "false"
      - name: Prepare exact approved queues and preflight
        run: |
          mkdir -p /tmp/bounded-canary
          python3 scripts/prepare_bounded_canary_publish.py --apply --confirm-bounded-canary --wave "${{ inputs.canary_wave }}" --batch-id "${{ inputs.canary_batch_id }}" --output /tmp/bounded-canary/preflight.json
          if [ "${{ inputs.canary_wave }}" = "first_wave" ]; then
            expected=4
          elif [ "${{ inputs.canary_wave }}" = "first_wave_images" ]; then
            expected=2
          elif [ "${{ inputs.canary_wave }}" = "remaining_eight" ]; then
            expected=8
          elif [ "${{ inputs.canary_wave }}" = "remaining_seven_recovery" ]; then
            expected=7
          else
            expected=12
          fi
          jq -e --argjson expected "$expected" '.status == "APPLIED" and .read_after_write == "PASS" and (.queue_ids | length == $expected)' /tmp/bounded-canary/preflight.json
      - name: Publish exact canaries sequentially
        if: >-
          (inputs.canary_wave == 'first_wave' && inputs.confirm_canary_publish == 'PUBLISH_FIRST_WAVE_APPROVED_CANARIES') ||
          (inputs.canary_wave == 'first_wave_images' && inputs.confirm_canary_publish == 'PUBLISH_REMAINING_FIRST_WAVE_IMAGES') ||
          (inputs.canary_wave == 'remaining_eight' && inputs.confirm_canary_publish == 'PUBLISH_APPROVED_REMAINING_EIGHT') ||
          (inputs.canary_wave == 'remaining_seven_recovery' && inputs.confirm_canary_publish == 'PUBLISH_APPROVED_REMAINING_SEVEN_RECOVERY') ||
          (inputs.canary_wave == 'all_12' && inputs.confirm_canary_publish == 'PUBLISH_12_APPROVED_CANARIES')
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_THREADS_CAROUSEL: "true"
        run: |
          : > /tmp/bounded-canary/outcomes.raw

          mapfile -t queue_ids < <(
            jq -r '.queue_ids[]' /tmp/bounded-canary/preflight.json
          )

          test "${#queue_ids[@]}" -gt 0

          worker=(
            python3 scripts/process_threads_queue.py
            --confirm-real-post
            --max-posts "${#queue_ids[@]}"
          )

          for queue_id in "${queue_ids[@]}"; do
            worker+=(--queue-id "$queue_id")
          done

          set +e
          "${worker[@]}" | tee /tmp/bounded-canary/outcomes.raw
          worker_status=${PIPESTATUS[0]}
          set -e

          echo "worker_status=$worker_status"

          python3 - <<'PY'
          import json
          from pathlib import Path

          requested = json.loads(Path("/tmp/bounded-canary/preflight.json").read_text())["queue_ids"]
          outcomes = []
          for line in Path("/tmp/bounded-canary/outcomes.raw").read_text().splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("queue_id") in requested:
                  outcomes.append(value)
          by_queue = {item["queue_id"]: item for item in outcomes}
          summary = {
              "requested_count": len(requested),
              "posted_count": sum(item.get("status") == "POSTED" for item in by_queue.values()),
              "outcomes": [by_queue.get(queue, {"queue_id": queue, "status": "MISSING_OUTCOME"}) for queue in requested],
          }
          Path("/tmp/bounded-canary/outcomes.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n")
          if summary["posted_count"] != summary["requested_count"]:
              raise SystemExit("requested_count != POSTED count")
          PY
      - name: Verify posted results and metrics reservations
        if: always()
        run: |
          python3 scripts/final_production_readiness.py --use-sheets --output /tmp/bounded-canary/readiness.json || true
          if [ "${{ inputs.canary_wave }}" = "all_12" ]; then
            python3 scripts/update_capability_matrix_from_evidence.py --use-sheets --apply --confirm-capability-update > /tmp/bounded-canary/capability.json || true
          fi
      - name: Upload bounded canary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-twelve-canary-${{ github.run_id }}
          path: /tmp/bounded-canary/*.json
          retention-days: 30
