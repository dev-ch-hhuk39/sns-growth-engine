name: WP3-C4 Safe URL Shape Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: wp3c4-safe-url-shape-diagnostics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect URL Shapes
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Inspector
        id: inspect
        env:
          GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
          SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
          SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
          PUBLISH_ENABLED: "false"
          ALLOW_REAL_THREADS_POST: "false"
          ALLOW_REAL_X_POST: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
          ALLOW_MEDIA_POSTS: "false"
          ALLOW_REAL_THREADS_VIDEO_POST: "false"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          set +e
          python3 scripts/inspect_wp3c4_unresolved_url_shapes.py \
            --output /tmp/wp3c4_safe.json \
            > /tmp/wp3c4_out.txt \
            2> /tmp/wp3c4_err.txt
          EXIT_CODE=$?
          set -e

          SAFE_PREFIX_COUNT=$(grep -c "^WP3C4_SAFE_URL_SHAPE_DIAGNOSTICS_JSON=" /tmp/wp3c4_out.txt || true)

          if [ "$SAFE_PREFIX_COUNT" != "1" ]; then
            SAFE_JSON_STR="{\"schema_version\":1,\"mode\":\"READ_ONLY_SAFE_URL_SHAPE_DIAGNOSTICS\",\"overall_status\":\"FAIL\",\"classification\":\"MIXED_OR_UNRESOLVED\",\"status_reasons\":[\"INSPECTOR_STARTUP_FAILED\"],\"checked_commit_sha\":\"$GITHUB_SHA\",\"parent_count\":0,\"child_count\":0,\"unique_parent_recovered_group_count\":0,\"unique_child_recovered_group_count\":0,\"unique_normalized_url_group_count\":0,\"unique_semantic_parent_group_count\":0,\"unique_semantic_child_group_count\":0,\"parents\":[],\"children\":[],\"recommended_next_action\":\"MANUAL_INVESTIGATION\",\"apply_operations\":[]}"
            printf '%s\n' "$SAFE_JSON_STR" > /tmp/wp3c4_safe_clean.json
            printf 'WP3C4_SAFE_URL_SHAPE_DIAGNOSTICS_JSON=%s\n' "$SAFE_JSON_STR"
            EXIT_CODE=1
          else
            SAFE_JSON_LINE=$(grep "^WP3C4_SAFE_URL_SHAPE_DIAGNOSTICS_JSON=" /tmp/wp3c4_out.txt)
            SAFE_JSON_STR=${SAFE_JSON_LINE#WP3C4_SAFE_URL_SHAPE_DIAGNOSTICS_JSON=}
            printf '%s\n' "$SAFE_JSON_STR" > /tmp/wp3c4_safe_clean.json
            printf 'WP3C4_SAFE_URL_SHAPE_DIAGNOSTICS_JSON=%s\n' "$SAFE_JSON_STR"
          fi

          python3 scripts/render_wp3c4_url_shape_summary.py \
            --json-input "/tmp/wp3c4_safe_clean.json" \
            --summary-output "$GITHUB_STEP_SUMMARY" \
            --exit-code "$EXIT_CODE"
