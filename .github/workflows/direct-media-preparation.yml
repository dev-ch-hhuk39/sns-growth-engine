name: Direct Media Preparation

on:
  workflow_dispatch:
    inputs:
      confirm_preparation:
        description: "Type true to ingest and READY one approved direct-media item per account"
        required: true
        default: "false"
      target_account:
        description: "Choose one account or run both serially"
        required: true
        type: choice
        options:
          - all
          - night_scout
          - liver_manager
        default: all

permissions:
  contents: read
  models: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_LOCAL_TRANSCRIPTION: "false"

jobs:
  prepare-direct-media:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account_id: ${{ fromJSON((github.event.inputs.target_account == 'all') && '["night_scout","liver_manager"]' || format('["{0}"]', github.event.inputs.target_account)) }}
    concurrency:
      group: sns-growth-direct-preparation-${{ matrix.account_id }}
      cancel-in-progress: false
    env:
      ACCOUNT_ID: ${{ matrix.account_id }}
      CONTENT_SLOT_ID: ${{ matrix.account_id == 'night_scout' && 'ns_1800_direct_media' || 'lm_1600_direct_media' }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_MODELS_ENABLED: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CLASSIFIER_MODEL: ${{ vars.GEMINI_CLASSIFIER_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_GENERATOR_MODEL: ${{ vars.GEMINI_GENERATOR_MODEL || 'gemini-3.5-flash' }}
      GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-3.1-flash-lite' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-media-runtime.txt
      - name: Install preparation dependencies
        run: python3 -m pip install --requirement requirements-media-runtime.txt
      - name: Install bounded OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-jpn
          command -v ffmpeg
          command -v ffprobe
          command -v tesseract
      - name: Acquire bounded X and YouTube reference posts before media preparation
        if: github.event.inputs.confirm_preparation == 'true'
        run: |
          python3 scripts/acquire_approved_source_posts_failsoft.py \
            --account-id "$ACCOUNT_ID" --platform x --max-posts 30 \
            --media-filter video-only --force-backfill \
            --apply --confirm-acquisition
          python3 scripts/acquire_approved_source_posts_failsoft.py \
            --account-id "$ACCOUNT_ID" --platform youtube --max-posts 30 \
            --media-filter video-only --force-backfill \
            --apply --confirm-acquisition
      - name: Dry-run direct preparation plan
        run: |
          python3 scripts/ingest_direct_reference_media.py --account-id "$ACCOUNT_ID" --dry-run
          python3 scripts/run_direct_reference_media_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-only --dry-run --use-sheets
      - name: Check free-tier preparation budget
        id: preparation_budget
        continue-on-error: true
        if: github.event.inputs.confirm_preparation == 'true'
        run: python3 scripts/check_media_resource_budget.py --use-sheets --check-cloudinary --apply --confirm-resource-usage --enforce --purpose prepare
      - name: Guard direct preparation
        if: github.event.inputs.confirm_preparation == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path("config/autonomous_mode.json").read_text()).get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          print("[OK] direct preparation enabled; publishing remains false")
          PY
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Ingest one approved source-post media bundle
        if: (github.event.inputs.confirm_preparation == 'true') && steps.preparation_budget.outcome == 'success'
        env:
          ALLOW_VIDEO_DOWNLOAD: "true"
          ALLOW_CLOUDINARY_UPLOAD: "true"
          ALLOW_LOCAL_TRANSCRIPTION: "true"
          ALLOW_TRANSCRIPTION_API: "false"
        run: python3 scripts/ingest_direct_reference_media_reliable.py --account-id "$ACCOUNT_ID" --max-assets 10 --apply --confirm-ingest
      - name: Persist validator-approved review inventory
        if: (github.event.inputs.confirm_preparation == 'true') && steps.preparation_budget.outcome == 'success'
        env:
          REQUIRE_PREPARED: "true"
        run: python3 scripts/run_direct_reference_media_pipeline_batched.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-only --apply --confirm-direct-media --use-sheets
      - name: Normalize prepared inventory for Hybrid review
        if: (github.event.inputs.confirm_preparation == 'true') && steps.preparation_budget.outcome == 'success'
        run: python3 scripts/normalize_unreviewed_slot_candidates.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --apply --confirm-normalize --use-sheets
      - name: Finalize prepared public text before human review
        if: (github.event.inputs.confirm_preparation == 'true') && steps.preparation_budget.outcome == 'success'
        run: python3 scripts/run_hybrid_ai_queue_gate.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --max-candidates 2 --apply --use-sheets
      - name: Sync prepared media to publication review
        if: (github.event.inputs.confirm_preparation == 'true') && steps.preparation_budget.outcome == 'success'
        run: |
          python3 scripts/sync_publication_review.py \
            --apply --confirm-review-sync --use-sheets \
            --output /tmp/direct-media-review.json
      - name: Clean expired transient media
        if: always()
        run: python3 scripts/cleanup_media_workspace.py --apply --confirm-cleanup
