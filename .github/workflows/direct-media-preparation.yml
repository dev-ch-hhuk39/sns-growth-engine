name: Direct Media Preparation

on:
  schedule:
    # Xserver's bounded primary preparation starts at 05:15 JST and has a
    # strict 270-minute ceiling. Run the read-first hosted fallback afterward.
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      confirm_preparation:
        description: "Type true to ingest and READY one approved direct-media item per account"
        required: true
        default: "false"
      target_account:
        description: "Managed account_id or all"
        required: true
        default: all

permissions:
  contents: read
  models: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_LOCAL_TRANSCRIPTION: "false"

jobs:
  resolve-accounts:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      account_ids: ${{ steps.registry.outputs.account_ids }}
      clip_account_ids: ${{ steps.registry.outputs.clip_account_ids }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - id: registry
        env:
          REQUESTED_ACCOUNT: ${{ github.event.inputs.target_account }}
          BEAUTY_ACTIVATION_APPROVED: ${{ secrets.BEAUTY_ACTIVATION_APPROVED || vars.BEAUTY_ACTIVATION_APPROVED || 'false' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          registry = json.loads(Path("config/managed_accounts.json").read_text())
          production = [
              account_id for account_id, row in registry["accounts"].items()
              if row.get("production_enabled") and row.get("status") == "ACTIVE"
              and (account_id != "beauty_account" or os.environ.get("BEAUTY_ACTIVATION_APPROVED", "").lower() == "true")
          ]
          requested = os.environ["REQUESTED_ACCOUNT"].strip() or "all"
          selected = production if requested == "all" else [requested]
          if not selected or any(account_id not in production for account_id in selected):
              raise SystemExit(f"[BLOCKED] unmanaged_or_inactive_account:{requested}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write("account_ids=" + json.dumps(selected, separators=(",", ":")) + "\n")
              clip_accounts = [account for account in selected if account in {"night_scout", "liver_manager"}]
              handle.write("clip_account_ids=" + json.dumps(clip_accounts, separators=(",", ":")) + "\n")
          PY

  prepare-direct-media:
    needs: resolve-accounts
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account_id: ${{ fromJSON(needs.resolve-accounts.outputs.account_ids) }}
    concurrency:
      group: sns-growth-direct-preparation-${{ matrix.account_id }}
      cancel-in-progress: false
    env:
      ACCOUNT_ID: ${{ matrix.account_id }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_MODELS_ENABLED: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CLASSIFIER_MODEL: ${{ vars.GEMINI_CLASSIFIER_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_GENERATOR_MODEL: ${{ vars.GEMINI_GENERATOR_MODEL || 'gemini-3.5-flash' }}
      GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'gemini-3.1-flash-lite' }}
      BEAUTY_ACTIVATION_APPROVED: ${{ secrets.BEAUTY_ACTIVATION_APPROVED || vars.BEAUTY_ACTIVATION_APPROVED || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Create this run's owned media workspace
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          name = f"sns-media-prep-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['ACCOUNT_ID']}"
          workspace = root / name
          if workspace.parent.resolve() != root or workspace.exists() or workspace.is_symlink():
              raise SystemExit("[BLOCKED] media workspace path is not a new runner-temp child")
          workspace.mkdir(mode=0o700)
          (workspace / ".sns-media-prep-owned").touch(mode=0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              for key in ("SNS_MEDIA_PREP_WORKSPACE", "TMPDIR", "TMP", "TEMP"):
                  env_file.write(f"{key}={workspace}\n")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-media-runtime.txt
      - name: Resolve account route slot
        run: |
          slot_id=$(PYTHONPATH=src python3 -c 'import os; from accounts.managed_accounts import route_slot_id; print(route_slot_id(os.environ["ACCOUNT_ID"], "direct_reference_media"))')
          echo "CONTENT_SLOT_ID=$slot_id" >> "$GITHUB_ENV"
      - name: Install preparation dependencies
        run: python3 -m pip install --requirement requirements-media-runtime.txt
      - name: Check publisher-usable Direct inventory before any acquisition
        id: direct_inventory
        run: |
          set -euo pipefail
          python3 scripts/run_direct_media_preparation_loop.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --minimum-ready 3 --check-only | tee /tmp/direct-inventory.json
          shortage=$(python3 -c 'import json; print("true" if json.load(open("/tmp/direct-inventory.json")).get("status") == "SHORTAGE" else "false")')
          echo "shortage=$shortage" >> "$GITHUB_OUTPUT"
      - name: Install pinned anonymous Threads CLI
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        env:
          THREADS_CLI_INSTALL_DIR: ${{ runner.temp }}/threads-cli
        run: |
          bash scripts/install_threads_cli.sh
          echo "${THREADS_CLI_INSTALL_DIR}" >> "$GITHUB_PATH"
      - name: Install public browser fallback
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: python3 -m playwright install --with-deps chromium
      - name: Install bounded OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-jpn
          command -v ffmpeg
          command -v ffprobe
          command -v tesseract
      - name: Start bounded YouTube PO Token Provider
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: scripts/start_youtube_pot_provider.sh
      - name: Cool down shared Sheets quota before acquisition
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: |
          echo "[SHEETS_QUOTA] waiting for the shared per-minute read window"
          sleep 70
      - name: Acquire bounded approved reference posts before media preparation
        id: acquisition
        continue-on-error: true
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: |
          python3 scripts/acquire_approved_source_posts_failsoft.py \
            --account-id "$ACCOUNT_ID" --platform all --max-posts 30 \
            --media-filter video-only --force-backfill \
            --apply --confirm-acquisition
      - name: Cool down shared Sheets quota before preparation
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: |
          echo "acquisition_outcome=${{ steps.acquisition.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "[SHEETS_QUOTA] waiting before the independent saved-inventory check"
          sleep 70
      - name: Dry-run direct preparation plan
        run: |
          python3 scripts/ingest_direct_reference_media.py --account-id "$ACCOUNT_ID" --dry-run
          python3 scripts/run_direct_reference_media_pipeline_batched.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-only --dry-run --use-sheets
      - name: Check free-tier preparation budget
        id: preparation_budget
        continue-on-error: true
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: python3 scripts/check_media_resource_budget.py --use-sheets --check-cloudinary --apply --confirm-resource-usage --enforce --purpose prepare
      - name: Guard direct preparation
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path("config/autonomous_mode.json").read_text()).get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          print("[OK] direct preparation enabled; publishing remains false")
          PY
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Prepare one eligible Direct candidate with bounded failover
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true' && steps.preparation_budget.outcome == 'success'
        env:
          ALLOW_VIDEO_DOWNLOAD: "true"
          ALLOW_CLOUDINARY_UPLOAD: "true"
          ALLOW_LOCAL_TRANSCRIPTION: "true"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          max_attempts=$(python3 -c 'import json; print(json.load(open("config/media_growth_engine.json"))["direct_media_candidate_attempts"])')
          python3 scripts/run_direct_media_preparation_loop.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --max-attempts "$max_attempts" --apply --confirm-preparation-loop
      - name: Sync prepared media to publication review
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true' && steps.preparation_budget.outcome == 'success'
        run: |
          python3 scripts/sync_publication_review.py \
            --apply --confirm-review-sync --use-sheets \
            --output /tmp/direct-media-review.json
      - name: Promote strict autonomous Direct Media to READY
        if: (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') && steps.direct_inventory.outputs.shortage == 'true' && steps.preparation_budget.outcome == 'success'
        run: |
          python3 scripts/promote_autonomous_direct_media_ready.py \
            --account-id "$ACCOUNT_ID" \
            --slot-id "$CONTENT_SLOT_ID" \
            --apply \
            --confirm-autonomous-ready \
            --use-sheets \
            --output /tmp/direct-media-autoready.json

          cat /tmp/direct-media-autoready.json

          {
            echo "### Autonomous Direct Media READY"
            echo '```json'
            cat /tmp/direct-media-autoready.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop bounded YouTube PO Token Provider
        if: always()
        run: scripts/stop_youtube_pot_provider.sh
      - name: Clean expired transient media
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          workspace_value = os.environ.get("SNS_MEDIA_PREP_WORKSPACE", "")
          if not workspace_value:
              print("[NO_OP] this run did not create an owned media workspace")
              raise SystemExit(0)
          workspace = Path(workspace_value)
          expected = f"sns-media-prep-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-"
          if (workspace.parent.resolve() == root and workspace.name.startswith(expected)
                  and not workspace.is_symlink() and (workspace / ".sns-media-prep-owned").is_file()):
              shutil.rmtree(workspace)
          PY

  refill-existing-approved-clips:
    needs: [resolve-accounts, prepare-direct-media]
    if: >-
      always() && needs.resolve-accounts.result == 'success' &&
      needs.prepare-direct-media.result != 'cancelled' &&
      (github.event_name == 'schedule' || github.event.inputs.confirm_preparation == 'true') &&
      needs.resolve-accounts.outputs.clip_account_ids != '[]'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account_id: ${{ fromJSON(needs.resolve-accounts.outputs.clip_account_ids) }}
    concurrency:
      group: sns-growth-approved-clip-hosted-reuse-${{ matrix.account_id }}
      cancel-in-progress: false
    env:
      ACCOUNT_ID: ${{ matrix.account_id }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      PUBLISH_ENABLED: "false"
      ALLOW_REAL_THREADS_POST: "false"
      ALLOW_REAL_THREADS_VIDEO_POST: "false"
      ALLOW_REAL_X_POST: "false"
      ALLOW_MEDIA_POSTS: "false"
      ALLOW_VIDEO_DOWNLOAD: "false"
      ALLOW_VIDEO_CUT: "false"
      ALLOW_CLOUDINARY_UPLOAD: "false"
      ALLOW_LOCAL_TRANSCRIPTION: "false"
      ALLOW_TRANSCRIPTION_API: "false"
      GITHUB_MODELS_ENABLED: "true"
      GITHUB_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-media-runtime.txt
      - name: Install bounded media runtime
        run: python3 -m pip install --requirement requirements-media-runtime.txt
      - name: Check kill switch and Sheets credentials
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          if json.loads(Path("config/autonomous_mode.json").read_text()).get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          for name in ("SPREADSHEET_ID", "SA_JSON_BASE64"):
              if not os.environ.get(name):
                  raise SystemExit(f"[BLOCKED] required secret is missing: {name}")
          print("[OK] reuse-only: publisher, download, cut, upload and transcription are disabled")
          PY
      - name: Resolve clip route slot and restore READY only from saved approved assets
        run: |
          slot_id=$(PYTHONPATH=src python3 -c 'import os; from accounts.managed_accounts import route_slot_id; print(route_slot_id(os.environ["ACCOUNT_ID"], "approved_source_clip"))')
          python3 scripts/run_media_production_pipeline.py \
            --account-id "$ACCOUNT_ID" --slot-id "$slot_id" \
            --prepare-only --minimum-ready 3 --reuse-uploaded-only \
            --apply --confirm-production-media --use-sheets \
            --json-output "/tmp/clip-reuse-${ACCOUNT_ID}.json"
      - name: Upload bounded recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-clip-reuse-${{ matrix.account_id }}-${{ github.run_id }}
          path: /tmp/clip-reuse-*.json
          if-no-files-found: ignore
          retention-days: 14
