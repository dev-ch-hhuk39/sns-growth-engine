name: CI WP3 Production Read-Only Verification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  readonly_verification:
    runs-on: ubuntu-latest
    environment: production
    env:
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check Credentials
        run: |
          if [ -z "$SNS_MASTER_SHEET_ID" ] && [ -z "$SPREADSHEET_ID" ]; then
            echo "[BLOCKED] Sheets spreadsheet secret is missing." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ -z "$SA_JSON_BASE64" ] && [ -z "$GCP_SA_JSON_BASE64" ]; then
            echo "[BLOCKED] Sheets service account secret is missing." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Collect Read-Only Evidence
        id: collector
        run: |
          python3 scripts/collect_wp3_readonly_evidence.py --output /tmp/wp3_evidence.json

          if [ ! -f /tmp/wp3_evidence.json ]; then
            echo "Failed to generate report JSON." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          status=$(jq -r '.overall_status // empty' /tmp/wp3_evidence.json)
          if [ -z "$status" ]; then
            echo "Failed to parse JSON." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "Status: $status" >> $GITHUB_STEP_SUMMARY

          if [ "$status" = "FAIL" ]; then
            exit 1
          fi

          if [ "$status" = "BLOCKED" ]; then
            jq -r '.status_reasons[]' /tmp/wp3_evidence.json >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$status" = "PASS" ]; then
            exit 0
          fi

          exit 1
