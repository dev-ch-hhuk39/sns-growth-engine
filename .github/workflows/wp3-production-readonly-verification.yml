name: WP3 Read-Only Production Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-growth-wp3-readonly-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      PUBLISH_ENABLED: "false"
      ALLOW_REAL_THREADS_POST: "false"
      ALLOW_REAL_X_POST: "false"
      ALLOW_VIDEO_DOWNLOAD: "false"
      ALLOW_VIDEO_CUT: "false"
      ALLOW_CLOUDINARY_UPLOAD: "false"
      ALLOW_MEDIA_POSTS: "false"
      ALLOW_REAL_THREADS_VIDEO_POST: "false"
      ALLOW_TRANSCRIPTION_API: "false"
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Check Credentials
        run: |
          if [ -z "$SA_JSON_BASE64" ]; then
            echo "Missing Sheets credentials"
            exit 1
          fi
          
      - name: Run Collector
        run: |
          python3 scripts/collect_wp3_readonly_evidence.py \
            --account-id all \
            --max-provider-rows 20 \
            --output /tmp/wp3-readonly-report.json
            
      - name: Safe Summary
        run: |
          if [ -f /tmp/wp3-readonly-report.json ]; then
            python3 -c '
          import json
          try:
              with open("/tmp/wp3-readonly-report.json") as f:
                  data = json.load(f)
              print(f"implementation_head: {data.get(\"implementation_head\")}")
              print(f"origin_main: {data.get(\"origin_main\")}")
              sv = data.get("sheets_verifier", {})
              print(f"sheets passed/total: {sv.get(\"passed\")}/{sv.get(\"total\")}")
              print(f"failed check count: {len(sv.get(\"failed\", []))}")
              print(f"posted_save_failed_count: {data.get(\"integrity\", {}).get(\"posted_save_failed_count\", 0)}")
              print(f"night text READY count: {data.get(\"text_pipeline\", {}).get(\"night_scout\", {}).get(\"ready_text_count\")}")
              print(f"liver text READY count: {data.get(\"text_pipeline\", {}).get(\"liver_manager\", {}).get(\"ready_text_count\")}")
              print(f"Liver Threads source classification: {data.get(\"liver_threads_source_classification\")}")
              c = data.get("credentials", {})
              print(f"Night credential status: {c.get(\"night_scout Threads publish credentials\")}")
              print(f"Liver credential status: {c.get(\"liver_manager Threads publish credentials\")}")
              print(f"parent integrity failure count: {len(data.get(\"integrity\", {}).get(\"parent_integrity_failures\", []))}")
              print(f"duplicate queue count: {len(data.get(\"integrity\", {}).get(\"duplicate_queue_ids\", []))}")
              print(f"duplicate slot count: {len(data.get(\"integrity\", {}).get(\"duplicate_slot_idempotency_keys\", []))}")
              print(f"unauthorized READY media count: {len(data.get(\"integrity\", {}).get(\"unauthorized_ready_media\", []))}")
              print(f"overall_status: {data.get(\"overall_status\")}")
          except Exception as e:
              print(f"Error parsing JSON: {e}")
            ' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Hard Failure Gate
        run: |
          if [ ! -f /tmp/wp3-readonly-report.json ]; then
            exit 1
          fi
          STATUS=$(python3 -c 'import json; print(json.load(open("/tmp/wp3-readonly-report.json")).get("overall_status", "FAIL"))')
          if [ "$STATUS" = "FAIL" ]; then
            exit 1
          elif [ "$STATUS" = "BLOCKED" ]; then
            echo "Workflow BLOCKED, but passing."
            exit 0
          elif [ "$STATUS" = "PASS" ]; then
            exit 0
          else
            exit 1
          fi
