name: CI WP3 Production Read-Only Verification

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  models: read

concurrency:
  group: sns-growth-wp3-readonly-verification
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  READONLY_TARGET_PR: "141"
  READONLY_TARGET_SHA: "4063eb6077b6470b7b7c5be01d50d4184a39f937"
  READONLY_REQUIREMENTS_SHA256: "6cb258d43e631391fb8c1de1c94d9413a7bc773e171a417f6438e7c41f0ec77b"

jobs:
  verify_exact_target:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed PR 141 head without production secrets
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 4063eb6077b6470b7b7c5be01d50d4184a39f937
          fetch-depth: 1
          persist-credentials: false

      - name: Verify PR 141 still points to the reviewed SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$READONLY_TARGET_SHA"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$READONLY_TARGET_PR" --jq '.head.sha')"
          test "$actual" = "$READONLY_TARGET_SHA"
          test "$(sha256sum requirements.txt | awk '{print $1}')" = "$READONLY_REQUIREMENTS_SHA256"

      - name: Setup Python for no-secret contract tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install unchanged dependencies without production secrets
        run: pip install -r requirements.txt

      - name: Run exact-head read-only contract tests without production secrets
        run: |
          python3 scripts/test_scheduled_autopost_preview_v2.py
          python3 scripts/test_scheduled_runtime_blockers.py
          python3 scripts/test_hybrid_ai_source_context_stability.py
          python3 scripts/test_auto_approve_hybrid_source_context_contract.py

  readonly_verification:
    needs: verify_exact_target
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT || secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT || secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER || secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER || secrets.THREADS_USER_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_MODELS_ENABLED: "true"

    steps:
      - name: Checkout exact reviewed PR 141 head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 4063eb6077b6470b7b7c5be01d50d4184a39f937
          fetch-depth: 1
          persist-credentials: false

      - name: Reconfirm exact target and unchanged dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$READONLY_TARGET_SHA"
          test "$(sha256sum requirements.txt | awk '{print $1}')" = "$READONLY_REQUIREMENTS_SHA256"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check Credentials
        run: |
          if [ -z "$SNS_MASTER_SHEET_ID" ] && [ -z "$SPREADSHEET_ID" ]; then
            echo "[\"SHEETS_SPREADSHEET_SECRET_MISSING\"]" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ -z "$SA_JSON_BASE64" ] && [ -z "$GCP_SA_JSON_BASE64" ]; then
            echo "[\"SHEETS_SA_SECRET_MISSING\"]" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "[\"GEMINI_API_KEY_MISSING\"]" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Collect Read-Only Evidence
        id: collector
        continue-on-error: true
        run: |
          python3 scripts/collect_wp3_readonly_evidence.py --output /tmp/wp3_evidence.json
          python3 scripts/evaluate_wp3_readonly_workflow_result.py /tmp/wp3_evidence.json $GITHUB_STEP_SUMMARY

      - name: Audit Scheduled Autopost Candidates
        id: scheduled_audit
        if: always()
        run: |
          python3 scripts/run_scheduled_autopost_readonly_audit.py \
            --json-output /tmp/scheduled-autopost-audit.json \
            --markdown-output /tmp/scheduled-autopost-audit.md
          cat /tmp/scheduled-autopost-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preview all scheduled candidates with Gemini
        id: scheduled_preview_v2
        if: always()
        run: |
          python3 scripts/run_scheduled_autopost_preview_v2.py

      - name: Preserve WP3 evidence failure after audit
        if: always() && steps.collector.outcome == 'failure'
        run: |
          echo '["WP3_READONLY_EVIDENCE_FAILED_AFTER_SCHEDULED_AUDIT"]' >> "$GITHUB_STEP_SUMMARY"
          exit 1
