name: Media Preparation Scheduler

# Xserver is the primary replenishment scheduler. This workflow is an
# explicitly confirmed, bounded operator fallback and is not scheduled, avoiding
# cross-host concurrent preparation against the same Sheets inventory.
on:
  workflow_dispatch:
    inputs:
      confirm_preparation:
        description: "Type true to run existing bounded Direct and approved-clip preparation"
        required: true
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: media-preparation-scheduler-manual
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - id: guard
        name: Verify explicit fallback confirmation and preparation activation
        env:
          CONFIRM_PREPARATION: ${{ github.event.inputs.confirm_preparation }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("config/autonomous_mode.json").read_text(encoding="utf-8"))
          enabled = (
              os.environ.get("CONFIRM_PREPARATION", "false").lower() == "true"
              and bool(config.get("scheduled_prepare_enabled"))
              and not bool(config.get("kill_switch"))
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"enabled={'true' if enabled else 'false'}\n")
          if not enabled:
              print("[NO_OP] explicit confirmation is missing, preparation is disabled, or kill switch is active")
          else:
              print("[OK] bounded preparation fallback confirmed; publishing remains disabled in child workflow")
          PY

  dispatch-direct:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bounded Direct preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"confirm_preparation":"true","target_account":"all"}}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/direct-media-preparation.yml/dispatches" \
            --data "$payload"
          echo "[DISPATCHED] bounded Direct preparation for active production accounts"

  dispatch-approved-clip:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: [night_scout, liver_manager]
    steps:
      - name: Dispatch bounded approved-source clip preparation
        env:
          GH_TOKEN: ${{ github.token }}
          ACCOUNT_ID: ${{ matrix.account }}
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"main","inputs":{"account_id":"%s","confirm_preparation":"true","dry_run_only":"false"}}' "$ACCOUNT_ID")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/approved-source-clip-preparation.yml/dispatches" \
            --data "$payload"
          echo "[DISPATCHED] bounded approved-source clip preparation account=$ACCOUNT_ID"
