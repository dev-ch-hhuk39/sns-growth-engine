name: Content Slot Recovery

on:
  schedule:
    # A read-only hosted audit is sufficient after the VPS scans at 0/1/2.
    # Do not queue 288 scheduled runs/day against the single shared VPS runner.
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: "Type true to run one backfill maximum per account"
        required: true
        default: "false"
      dry_run_only:
        required: false
        default: "false"

permissions:
  contents: read
  actions: read
env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  audit-missed-slots:
    # Scheduled auditing must never consume the self-hosted production runner.
    # No publisher flags, deployment, token refresh, queue mutation or uploads.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        account: [night_scout, liver_manager, beauty_account]
    env:
      ACCOUNT_ID: ${{ matrix.account }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install read-only auditor dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Read-only missed-slot audit (redacted)
        shell: bash
        run: |
          set -euo pipefail
          # Keep draft/queue details and provider diagnostics out of public logs.
          audit_file="$RUNNER_TEMP/sns-slot-audit.json"
          error_file="$RUNNER_TEMP/sns-slot-audit.err"
          # Keep original audit failure semantics. The separate parser emits
          # *only* preapproved aggregate labels/counts, never queue IDs, Sheet
          # rows, user content or raw provider/HTTP error strings.
          audit_rc=0
          python3 scripts/reconcile_due_production_slots.py \
            --account-id "$ACCOUNT_ID" --dry-run > "$audit_file" 2> "$error_file" || audit_rc=$?
          summary_rc=0
          python3 scripts/summarize_readonly_slot_audit.py \
            --account-id "$ACCOUNT_ID" --report-file "$audit_file" || summary_rc=$?
          if [ "$audit_rc" -eq 0 ] && [ "$summary_rc" -eq 0 ]; then
            echo "READ_ONLY_SLOT_AUDIT_PASS account=$ACCOUNT_ID"
          else
            echo "::error::READ_ONLY_SLOT_AUDIT_FAILED account=$ACCOUNT_ID (classified result above; details withheld)"
            exit 1
          fi

  recover-missed-slots:
    # Only explicitly requested manual recovery can reserve this VPS runner.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      # Accounts share the Sheets service-account read quota, not post state.
      max-parallel: 1
      matrix:
        include:
          - account: night_scout
            lock: night-scout
          - account: liver_manager
            lock: liver-manager
          - account: beauty_account
            lock: beauty-account
    concurrency:
      group: sns-growth-production-${{ matrix.lock }}-${{ github.ref }}
      cancel-in-progress: false
    # Scheduled recovery is a secondary trigger only.  The self-hosted VPS
    # launcher owns the lock and is the sole publisher when the buffered
    # inventory cutover is active.
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 25
    env:
      ACCOUNT_ID: ${{ matrix.account }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT }}
      THREADS_HANDLE_NIGHT_SCOUT: ${{ secrets.THREADS_HANDLE_NIGHT_SCOUT }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}
      THREADS_HANDLE_LIVER_MANAGER: ${{ secrets.THREADS_HANDLE_LIVER_MANAGER }}
      THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT: ${{ secrets.THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT }}
      THREADS_USER_ID_BEAUTY_ACCOUNT: ${{ secrets.THREADS_USER_ID_BEAUTY_ACCOUNT }}
      THREADS_HANDLE_BEAUTY_ACCOUNT: ${{ secrets.THREADS_HANDLE_BEAUTY_ACCOUNT }}
      BEAUTY_ACTIVATION_APPROVED: ${{ secrets.BEAUTY_ACTIVATION_APPROVED || vars.BEAUTY_ACTIVATION_APPROVED || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Dry-run missed-slot scan
        continue-on-error: true
        run: python3 scripts/reconcile_due_production_slots.py --account-id "$ACCOUNT_ID" --dry-run
      - name: Guard and backfill at most one slot per account
        # Scheduled scans are read-only. External posts require a separate
        # intentional manual dispatch and explicit owner-controlled activation.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_recovery == 'true' && github.event.inputs.dry_run_only != 'true' && vars.SNS_OWNER_PUBLISH_APPROVED == 'true'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          BEAUTY_PRODUCTION_ENABLED: ${{ matrix.account == 'beauty_account' && 'true' || 'false' }}
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_THREADS_CAROUSEL: "true"
          ALLOW_THREADS_MIXED_CAROUSEL: "false"
          ALLOW_REAL_X_POST: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path('config/autonomous_mode.json').read_text()).get('kill_switch'):
              raise SystemExit('[BLOCKED] kill_switch=true')
          PY
          buffered=$(python3 -c 'import json; print(str(json.load(open("config/production_inventory.json"))["activation_enabled"]).lower())')
          if [ "$buffered" = "true" ]; then
            scripts/run_buffered_production_host.sh \
              --account-id "$ACCOUNT_ID" \
              --apply --confirm-reconcile \
              --trigger github_schedule_recovery
          else
            # Never revert to the pre-buffer legacy publisher if the activation
            # mirror is unset or disabled. One-use VPS authority is mandatory.
            echo '[NO_POST] BUFFERED_RUNTIME_INACTIVE_LEGACY_FALLBACK_DISABLED'
          fi
