name: Approved Source Clip Preparation

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Active managed account_id"
        required: true
        default: beauty_account
      confirm_preparation:
        description: "Type true to prepare at most one approved clip asset"
        required: true
        default: "false"
      dry_run_only:
        description: "Plan only; never download, cut, upload, or post"
        required: false
        default: "true"

permissions:
  contents: read
  models: read

concurrency:
  group: approved-source-clip-preparation-${{ github.event.inputs.account_id }}
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  SNS_YTDLP_NODE_PATH: /opt/sns-node-v22.23.2/bin/node

jobs:
  prepare-one-approved-clip:
    # Physical YouTube acquisition cannot reliably use GitHub's shared runner
    # IP ranges. Keep the bounded, permission-gated clip job on the same
    # production host that owns the scheduler and proven media runtime.
    runs-on: [self-hosted, Linux, X64]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    timeout-minutes: 60
    concurrency:
      group: sns-growth-approved-clip-hosted-reuse-${{ github.event.inputs.account_id }}
      cancel-in-progress: false
    env:
      ACCOUNT_ID: ${{ github.event.inputs.account_id }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_MODELS_ENABLED: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Read Xserver timezone and installed preparation cron
        run: |
          python3 - <<'PY'
          import subprocess

          def output(argv):
              result = subprocess.run(argv, capture_output=True, text=True, check=False, timeout=10)
              return result.stdout.strip() if result.returncode == 0 else "UNAVAILABLE"

          local_time = output(["date", "--iso-8601=seconds"])
          timezone = output(["timedatectl", "show", "-p", "Timezone", "--value"])
          timezone_abbr = output(["date", "+%Z"])
          crontab = output(["crontab", "-l"])
          cron_rows = []
          cron_tz = ""
          for line in crontab.splitlines():
              stripped = line.strip()
              if stripped.startswith("CRON_TZ="):
                  cron_tz = stripped.split("=", 1)[1].strip()
              if "run_buffered_media_preparation_host.sh" not in stripped:
                  continue
              fields = stripped.split()
              if len(fields) >= 6:
                  cron_rows.append(" ".join(fields[:5]))
          print(f"XSERVER_LOCAL_TIME={local_time}")
          print(f"XSERVER_TIMEZONE={timezone}")
          print(f"XSERVER_TIMEZONE_ABBR={timezone_abbr}")
          print(f"XSERVER_MEDIA_CRON={' | '.join(cron_rows) if cron_rows else 'NOT_FOUND'}")
          print(f"XSERVER_CRON_TZ={cron_tz or 'SYSTEM_TIMEZONE'}")
          PY
      - name: Create this run's owned media workspace
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          name = f"sns-media-prep-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-{os.environ['ACCOUNT_ID']}"
          workspace = root / name
          if workspace.parent.resolve() != root or workspace.exists() or workspace.is_symlink():
              raise SystemExit("[BLOCKED] media workspace path is not a new runner-temp child")
          workspace.mkdir(mode=0o700)
          (workspace / ".sns-media-prep-owned").touch(mode=0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              for key in ("SNS_MEDIA_PREP_WORKSPACE", "TMPDIR", "TMP", "TEMP"):
                  env_file.write(f"{key}={workspace}\n")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install bounded media runtime
        run: |
          command -v ffmpeg >/dev/null || { echo "[BLOCKED] ffmpeg is unavailable on the production runner"; exit 1; }
          command -v docker >/dev/null || { echo "[BLOCKED] Docker is unavailable on the production runner"; exit 1; }
          command -v google-chrome >/dev/null || { echo "[BLOCKED] Google Chrome is unavailable for the bounded WPC provider"; exit 1; }
          command -v xvfb-run >/dev/null || { echo "[BLOCKED] xvfb-run is unavailable for the bounded WPC provider"; exit 1; }
          test -x "$SNS_YTDLP_NODE_PATH" || { echo "[BLOCKED] approved Node 22 runtime is unavailable"; exit 1; }
          test "$($SNS_YTDLP_NODE_PATH --version | cut -d. -f1)" = "v22" || { echo "[BLOCKED] approved Node runtime is not v22"; exit 1; }
          python3 -m pip install --requirement requirements-media-runtime.txt
      - name: Start bounded YouTube PO Token Provider
        if: github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true'
        run: scripts/start_youtube_pot_provider.sh
      - name: Resolve managed account and clip slot
        run: |
          slot_id=$(PYTHONPATH=src python3 -c 'import os; from accounts.managed_accounts import account_production_enabled, route_slot_id; account=os.environ["ACCOUNT_ID"]; assert account_production_enabled(account), "inactive_managed_account"; print(route_slot_id(account, "approved_source_clip"))')
          echo "CONTENT_SLOT_ID=$slot_id" >> "$GITHUB_ENV"
      - name: Guard bounded preparation and required secrets
        if: github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path("config/autonomous_mode.json").read_text()).get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          print("[OK] one approved clip may be prepared; publishing remains disabled")
          PY
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Dry-run approved clip plan
        run: python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-only --dry-run --use-sheets
      - name: Check bounded preparation budget
        id: media_budget
        if: github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true'
        run: python3 scripts/check_media_resource_budget.py --use-sheets --check-cloudinary --apply --confirm-resource-usage --enforce --purpose prepare
      - name: Discover bounded approved source videos
        if: github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true' && steps.media_budget.outcome == 'success'
        run: python3 scripts/discover_approved_source_videos.py --account-id "$ACCOUNT_ID" --use-sheets --fetch-real --apply --confirm-discovery
      - name: Transcribe one approved source locally
        id: transcribe
        continue-on-error: true
        if: github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true' && steps.media_budget.outcome == 'success'
        env:
          ALLOW_VIDEO_DOWNLOAD: "true"
          ALLOW_LOCAL_TRANSCRIPTION: "true"
        run: xvfb-run -a python3 scripts/transcribe_approved_source_videos.py --account-id "$ACCOUNT_ID" --use-sheets --apply --confirm-transcribe --allow-local-whisper --limit 2 --model-size small --max-audio-seconds 900 --cpu-threads 1
      - name: Generate transcript-grounded candidates
        if: github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true' && steps.media_budget.outcome == 'success'
        run: python3 scripts/run_media_growth_engine.py --account-id "$ACCOUNT_ID" --use-sheets --apply --confirm-media-growth
      - name: Prepare one approved clip asset
        if: vars.BUFFERED_INVENTORY_ACTIVE != 'true' && github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true' && steps.media_budget.outcome == 'success'
        env:
          ALLOW_VIDEO_DOWNLOAD: "true"
          ALLOW_VIDEO_CUT: "true"
          ALLOW_CLOUDINARY_UPLOAD: "true"
        run: xvfb-run -a python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-only --apply --confirm-production-media --use-sheets
      - name: Create one exact canonical clip queue
        id: clip_queue
        if: vars.BUFFERED_INVENTORY_ACTIVE != 'true' && github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true' && steps.media_budget.outcome == 'success'
        run: |
          xvfb-run -a python3 scripts/run_media_production_pipeline.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --prepare-saved-media-queue --apply --confirm-production-media --use-sheets \
            --json-output /tmp/approved-clip-queue.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/approved-clip-queue.json").read_text())
          queue_id = str(payload.get("queue_id", ""))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"queue_id={queue_id}\n")
              handle.write(f"status={payload.get('status', '')}\n")
          PY
      - name: Hybrid review and strict autonomous READY
        if: steps.clip_queue.outputs.queue_id != ''
        run: |
          python3 scripts/run_hybrid_ready_pipeline.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --queue-id "${{ steps.clip_queue.outputs.queue_id }}" \
            --max-candidates 1 --approval-mode media --autonomous-low-risk \
            --apply --use-sheets --json-output /tmp/approved-clip-hybrid.json
      - name: Refill strictly approved clip buffer
        if: vars.BUFFERED_INVENTORY_ACTIVE == 'true' && github.event.inputs.confirm_preparation == 'true' && github.event.inputs.dry_run_only != 'true' && steps.media_budget.outcome == 'success'
        env:
          ALLOW_VIDEO_DOWNLOAD: "true"
          ALLOW_VIDEO_CUT: "true"
          ALLOW_CLOUDINARY_UPLOAD: "true"
        run: |
          xvfb-run -a python3 scripts/run_media_production_pipeline.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --prepare-only --minimum-ready 3 --apply --confirm-production-media --use-sheets \
            --json-output /tmp/approved-clip-buffer.json
      - name: Sync exact clip candidate to publication review
        if: steps.clip_queue.outputs.queue_id != ''
        run: |
          python3 scripts/sync_publication_review.py \
            --apply --confirm-review-sync --use-sheets \
            --output /tmp/approved-clip-review.json
      - name: Upload bounded preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-clip-preparation-${{ github.event.inputs.account_id }}-${{ github.run_id }}
          path: |
            /tmp/approved-clip-queue.json
            /tmp/approved-clip-hybrid.json
            /tmp/approved-clip-review.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop bounded YouTube PO Token Provider
        if: always()
        run: scripts/stop_youtube_pot_provider.sh
      - name: Clean expired transient media
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]).resolve()
          workspace_value = os.environ.get("SNS_MEDIA_PREP_WORKSPACE", "")
          if not workspace_value:
              print("[NO_OP] this run did not create an owned media workspace")
              raise SystemExit(0)
          workspace = Path(workspace_value)
          expected = f"sns-media-prep-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-"
          if (workspace.parent.resolve() == root and workspace.name.startswith(expected)
                  and not workspace.is_symlink() and (workspace / ".sns-media-prep-owned").is_file()):
              shutil.rmtree(workspace)
          PY
      - name: Health summary
        if: always()
        continue-on-error: true
        run: python3 scripts/check_autonomous_health.py --account-id "$ACCOUNT_ID" --dry-run --use-sheets
