name: CI Security and Regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sns-growth-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lightweight gate dependencies
        run: python3 -m pip install --requirement requirements-ci.txt
      - name: Secret diff scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Ruff lint
        run: python3 -m ruff check --select E9,F63,F7,F82 src scripts
      - name: Syntax and import compile check
        run: python3 -m compileall -q src scripts
      - name: Source registry validation and focused contracts
        run: |
          python3 scripts/validate_source_registry.py
          python3 scripts/test_no_fetch_enabled_added.py
          python3 scripts/test_source_registry_no_x_fetch_by_default.py
          python3 scripts/test_collect_source_posts_x_bounded_adapter.py
          python3 scripts/test_collect_source_posts_threads_real_adapter_plan.py
          python3 scripts/test_collect_source_posts_manual_json_fallback.py
          python3 scripts/test_collect_source_posts_parent_bundle.py
          python3 scripts/test_stale_operational_quarantine_plan.py
          python3 scripts/test_bounded_media_canary_plan.py
          python3 scripts/test_media_pipeline_never_falls_back_to_text.py
          python3 scripts/test_final_production_contracts.py
          python3 scripts/test_final_preparation_orchestrator.py
          python3 scripts/test_live_canary_inventory_contract.py
          python3 scripts/test_media_slots_no_text_fallback_final.py
          python3 scripts/test_scheduled_publish_activation_gate.py
          python3 scripts/test_activate_scheduled_publish.py
          python3 scripts/test_capability_matrix_evidence_updater.py
          python3 scripts/test_final_production_preparation_workflow.py
          python3 scripts/test_import_owned_canary_assets_contract.py

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-acquisition.txt
            requirements-ci.txt
      - name: Install pinned test dependencies
        run: python3 -m pip install --requirement requirements-acquisition.txt --requirement requirements-ci.txt
      - name: Ruff lint
        run: python3 -m ruff check --select E9,F63,F7,F82 src scripts
      - name: Mypy type check
        run: >-
          python3 -m mypy
          --follow-imports=skip
          --ignore-missing-imports
          --check-untyped-defs
          scripts/content_schedule.py
          scripts/content_slot_runs.py
          scripts/media_source_policy.py
      - name: Syntax and import compile check
        run: python3 -m compileall -q src scripts
      - name: Unit and integration tests
        run: python3 scripts/run_repository_tests.py --json-output /tmp/repository-tests.json
      - name: Workflow security and license contracts
        run: |
          python3 scripts/test_all_workflows_safety_flags.py
          python3 scripts/test_workflow_permissions_declared.py
          python3 scripts/test_library_capability_matrix_complete.py
          python3 scripts/test_external_library_registry.py

  dependency-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-acquisition.txt requirements-media-runtime.txt requirements-ci.txt

  secret-history-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
