name: WP3-C5 Safe YouTube Path Provenance

on:
  workflow_dispatch:

concurrency:
  group: wp3c5-safe-youtube-path-provenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect YouTube Path Provenance
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Inspector
        id: inspect
        env:
          GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
          SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
          SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
          PUBLISH_ENABLED: "false"
          ALLOW_REAL_THREADS_POST: "false"
          ALLOW_REAL_X_POST: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
          ALLOW_MEDIA_POSTS: "false"
          ALLOW_REAL_THREADS_VIDEO_POST: "false"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          set +e
          python3 scripts/inspect_wp3c5_youtube_path_provenance.py \
            --output /tmp/wp3c5_safe.json \
            > /tmp/wp3c5_out.txt \
            2> /tmp/wp3c5_err.txt
          EXIT_CODE=$?
          set -e

          SAFE_PREFIX_COUNT=$(grep -c "^WP3C5_SAFE_YOUTUBE_PATH_PROVENANCE_JSON=" /tmp/wp3c5_out.txt || true)

          if [ "$SAFE_PREFIX_COUNT" != "1" ]; then
            SAFE_JSON_STR="{\"schema_version\":1,\"mode\":\"READ_ONLY_SAFE_YOUTUBE_PATH_PROVENANCE\",\"overall_status\":\"FAIL\",\"classification\":\"MIXED_OR_UNRESOLVED\",\"status_reasons\":[\"INSPECTOR_STARTUP_FAILED\"],\"checked_commit_sha\":\"$GITHUB_SHA\",\"counts\":{\"parent_count\":0,\"child_count\":0,\"unique_external_post_id_group_count\":0,\"unique_source_id_group_count\":0,\"unique_child_id_group_count\":0,\"unique_parent_canonical_url_group_count\":0,\"unique_child_canonical_url_group_count\":0,\"unique_child_original_media_url_group_count\":0,\"unique_parent_tab_kind_count\":0,\"unique_child_tab_kind_count\":0,\"parent_child_url_group_match_count\":0,\"parent_child_row_number_match_count\":0,\"unique_parent_recovered_group_count\":0,\"unique_child_recovered_group_count\":0},\"static_trace\":{},\"parents\":[],\"children\":[],\"recommended_next_action\":\"MANUAL_INVESTIGATION\",\"apply_operations\":[]}"
            printf '%s\n' "$SAFE_JSON_STR" > /tmp/wp3c5_safe_clean.json
            printf 'WP3C5_SAFE_YOUTUBE_PATH_PROVENANCE_JSON=%s\n' "$SAFE_JSON_STR"
            EXIT_CODE=1
          else
            SAFE_JSON_LINE=$(grep "^WP3C5_SAFE_YOUTUBE_PATH_PROVENANCE_JSON=" /tmp/wp3c5_out.txt)
            SAFE_JSON_STR=${SAFE_JSON_LINE#WP3C5_SAFE_YOUTUBE_PATH_PROVENANCE_JSON=}
            printf '%s\n' "$SAFE_JSON_STR" > /tmp/wp3c5_safe_clean.json
            printf 'WP3C5_SAFE_YOUTUBE_PATH_PROVENANCE_JSON=%s\n' "$SAFE_JSON_STR"
          fi

          python3 scripts/render_wp3c5_youtube_path_provenance_summary.py \
            --json-file "/tmp/wp3c5_safe_clean.json" \
            --exit-code "$EXIT_CODE" \
            > "$GITHUB_STEP_SUMMARY"
