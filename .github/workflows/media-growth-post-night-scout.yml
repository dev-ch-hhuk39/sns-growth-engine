name: Media Growth Post Night Scout

on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      confirm_media_post:
        description: "Type true to post one saved approved night_scout media asset"
        required: true
        default: "false"
      dry_run_only:
        description: "Plan only; never post"
        required: false
        default: "false"
      queue_id:
        description: "Exact human-approved READY queue ID (required for manual publish)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: sns-growth-production-night-scout-${{ github.ref }}
  cancel-in-progress: false

env:
  ACCOUNT_ID: "night_scout"
  CONTENT_SLOT_ID: "ns_2100_clip_media"
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  post-saved-approved-media:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify triggering revision
        run: |
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Schedule heartbeat
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "event=${{ github.event_name }}"
          echo "account=$ACCOUNT_ID"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Early runtime preflight
        id: preflight
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm_media_post }}
          MANUAL_QUEUE_ID: ${{ github.event.inputs.queue_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from scheduled_execution_guard import append_job_summary, missing_required_secrets, scheduled_window_decision
          should_publish = os.environ.get("GITHUB_EVENT_NAME") == "schedule" or os.environ.get("MANUAL_CONFIRM") == "true"
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and os.environ.get("MANUAL_CONFIRM") == "true" and not os.environ.get("MANUAL_QUEUE_ID", "").strip():
              raise SystemExit("[BLOCKED] manual publish requires exact queue_id")
          missing = missing_required_secrets(("GEMINI_API_KEY",)) if should_publish else []
          window = scheduled_window_decision(os.environ["CONTENT_SLOT_ID"])
          payload = {"missing_secret_names": missing, "window": window}
          append_job_summary("Scheduled media preflight", payload)
          print(json.dumps(payload, ensure_ascii=False))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"window_allowed={'true' if window.get('status') == 'PASS' else 'false'}\n")
          if missing:
              raise SystemExit("[BLOCKED] required production secret is unavailable: " + ",".join(missing))
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dry-run saved media plan
        run: python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --post-saved-media --dry-run --use-sheets
      - name: Create exact WAITING_REVIEW clip queue
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-saved-media-queue --apply --confirm-production-media --use-sheets --json-output /tmp/clip-queue.json
      - name: Normalize exact scheduled media caption
        if: github.event_name == 'schedule'
        run: python3 scripts/normalize_scheduled_media_caption.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --apply --use-sheets
      - name: Stop delayed scheduled execution after preserving candidate
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed != 'true'
        run: |
          echo '{"status":"NO_POST","reason":"scheduled_run_out_of_window","candidate_preserved":true}' | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Hybrid review and exact media promotion
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true'
        run: python3 scripts/run_hybrid_ready_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --queue-id "${{ github.event.inputs.queue_id }}" --max-candidates 1 --approval-mode media --apply --use-sheets --json-output /tmp/hybrid-ready.json
      - name: Hybrid review and autonomous exact media promotion
        id: clip_ready
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true'
        continue-on-error: true
        run: |
          qid=$(python3 -c "import json; print(json.load(open('/tmp/clip-queue.json')).get('queue_id',''))")
          if [ -z "$qid" ]; then echo "has_ready=false" >> "$GITHUB_OUTPUT"; echo "[NO_POST] no eligible exact clip queue"; exit 0; fi
          python3 scripts/run_hybrid_ready_pipeline.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --queue-id "$qid" --max-candidates 1 --approval-mode media \
            --autonomous-low-risk --apply --use-sheets \
            --json-output /tmp/hybrid-ready.json
          status=$(python3 -c "import json; print(json.load(open('/tmp/hybrid-ready.json')).get('status',''))")
          echo "has_ready=$([ "$status" = READY ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Recover exhausted clip slot with explicit safe text
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true' && steps.clip_ready.outputs.has_ready != 'true'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_X_POST: "false"
        run: |
          python3 scripts/scheduled_publish_activation_gate.py --use-sheets --account-id "$ACCOUNT_ID" --post-type original_text
          python3 scripts/run_slot_text_fallback.py \
            --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" \
            --reason approved_clip_inventory_exhausted \
            --allow-media-slot-safe-text-fallback \
            --apply --confirm-slot-fallback --use-sheets
      - name: Resolve scheduled activation gate
        id: activation
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true' && steps.clip_ready.outputs.has_ready == 'true'
        run: |
          set +e
          python3 scripts/scheduled_publish_activation_gate.py --use-sheets --account-id "$ACCOUNT_ID" --post-type approved_source_clip | tee /tmp/activation-gate.json
          rc=${PIPESTATUS[0]}
          {
            echo "### Runtime activation gate"
            echo '```json'
            cat /tmp/activation-gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
      - name: Check free-tier media budget
        id: media_budget
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.clip_ready.outputs.has_ready == 'true' && steps.activation.outputs.allowed == 'true')
        run: python3 scripts/check_media_resource_budget.py --use-sheets --apply --confirm-resource-usage --enforce --purpose post
      - name: Guard media post and kill switch
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.clip_ready.outputs.has_ready == 'true' && steps.activation.outputs.allowed == 'true')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          auto = json.loads(Path("config/autonomous_mode.json").read_text())
          media = json.loads(Path("config/media_growth_engine.json").read_text())
          if auto.get("kill_switch") or not media.get("saved_media_post_enabled"):
              raise SystemExit("[BLOCKED] media post disabled by kill switch or config")
          PY
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 THREADS_ACCESS_TOKEN_NIGHT_SCOUT THREADS_USER_ID_NIGHT_SCOUT GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Post one saved approved media asset
        if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.clip_ready.outputs.has_ready == 'true' && steps.activation.outputs.allowed == 'true')) && steps.media_budget.outcome == 'success'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_REAL_X_POST: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          qid=$(python3 -c "import json; print(json.load(open('/tmp/hybrid-ready.json')).get('selected_queue_id',''))")
          if [ -z "$qid" ]; then echo "[OPERATIONAL_FAILURE] no AI-approved clip candidate"; exit 1; fi
          python3 scripts/process_threads_queue.py --account-id "$ACCOUNT_ID" --queue-id "$qid" --max-posts 1 --confirm-real-post
      - name: Health summary
        if: always()
        continue-on-error: true
        run: python3 scripts/check_autonomous_health.py --account-id "$ACCOUNT_ID" --dry-run --use-sheets
