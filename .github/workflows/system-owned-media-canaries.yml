name: System Owned Media Canaries

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: Target generated-owned account scope
        type: choice
        required: true
        default: all
        options: [all, night_scout, liver_manager]
      mode:
        description: Render-only dry-run or generate/upload/register apply
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
      confirm_system_owned_media:
        description: "Required for apply: type GENERATE_SYSTEM_OWNED_MEDIA"
        required: false
        default: ""

permissions:
  contents: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_MEDIA_POSTS: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ACCOUNT_ID: ${{ inputs.account_id }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm_system_owned_media }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install generated-media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-noto-cjk
          python3 -m pip install --requirement requirements.txt
      - name: Guard confirmed generated-media apply
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "GENERATE_SYSTEM_OWNED_MEDIA" ]; then
            echo "BLOCKED: apply requires GENERATE_SYSTEM_OWNED_MEDIA"
            exit 1
          fi
      - name: Render, upload, and register system-owned media
        env:
          ALLOW_CLOUDINARY_UPLOAD: ${{ inputs.mode == 'apply' && 'true' || 'false' }}
        run: |
          mkdir -p /tmp/system-owned-media
          if [ "$MODE" = "apply" ]; then
            python3 scripts/run_system_owned_media_canaries.py --account-id "$ACCOUNT_ID" --apply --confirm-system-owned-media | tee /tmp/system-owned-media/result.json
          else
            python3 scripts/run_system_owned_media_canaries.py --account-id "$ACCOUNT_ID" --dry-run | tee /tmp/system-owned-media/result.json
          fi
      - name: Upload non-secret generation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-owned-media-${{ github.run_id }}
          path: /tmp/system-owned-media/result.json
          if-no-files-found: warn
          retention-days: 14
