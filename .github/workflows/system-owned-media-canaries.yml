name: System Owned Media Canaries

on:
  workflow_dispatch:
    inputs:
      generation_scope:
        description: Prepare the exact four-item first wave or use custom targets
        type: choice
        required: true
        default: first_wave
        options: [first_wave, custom]
      first_wave_batch_id:
        description: "Stable batch id. Required for approved apply; reuse the dry-run id."
        required: false
        default: ""
      expected_first_wave_manifest_hash:
        description: "Exact design_manifest_hash from the approved first-wave dry-run"
        required: false
        default: ""
      confirm_first_wave:
        description: "Required for first-wave apply: PREPARE_APPROVED_FIRST_WAVE"
        required: false
        default: ""
      account_id:
        description: Target generated-owned account scope
        type: choice
        required: true
        default: all
        options: [all, night_scout, liver_manager]
      mode:
        description: Render-only dry-run or generate/upload/register apply
        type: choice
        required: true
        default: dry-run
        options: [dry-run, apply]
      confirm_system_owned_media:
        description: "Required for apply: type GENERATE_SYSTEM_OWNED_MEDIA"
        required: false
        default: ""
      media_content_types:
        description: "Comma-separated media types; defaults to all owned-media types"
        required: false
        default: "direct_image,direct_carousel,direct_video,generated_clip"
      text_targets:
        description: "Comma-separated account_id:content_type values; defaults to the full fresh text set"
        required: false
        default: "night_scout:original_text,night_scout:reference_text,liver_manager:original_text,liver_manager:reference_text"
      supersede_previous_first_wave:
        description: "Exclude the four reviewed quality-failed first-wave rows before regeneration"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_MEDIA_POSTS: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GENERATION_SCOPE: ${{ inputs.generation_scope }}
      FIRST_WAVE_BATCH_ID: ${{ inputs.first_wave_batch_id }}
      EXPECTED_FIRST_WAVE_MANIFEST_HASH: ${{ inputs.expected_first_wave_manifest_hash }}
      CONFIRM_FIRST_WAVE: ${{ inputs.confirm_first_wave }}
      ACCOUNT_ID: ${{ inputs.account_id }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm_system_owned_media }}
      MEDIA_CONTENT_TYPES: ${{ inputs.media_content_types }}
      TEXT_TARGETS: ${{ inputs.text_targets }}
      SUPERSEDE_PREVIOUS_FIRST_WAVE: ${{ inputs.supersede_previous_first_wave }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install generated-media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-noto-cjk
          python3 -m pip install --requirement requirements.txt
      - name: Resolve and guard preparation scope
        run: |
          resolved_batch="$FIRST_WAVE_BATCH_ID"
          if [ -z "$resolved_batch" ]; then resolved_batch="fresh_first_wave_${GITHUB_RUN_ID}"; fi
          echo "RESOLVED_FIRST_WAVE_BATCH_ID=$resolved_batch" >> "$GITHUB_ENV"
          if [ "$MODE" = "apply" ] && [ "$GENERATION_SCOPE" = "first_wave" ]; then
            if [ "$CONFIRM_FIRST_WAVE" != "PREPARE_APPROVED_FIRST_WAVE" ] || [ -z "$FIRST_WAVE_BATCH_ID" ] || [ -z "$EXPECTED_FIRST_WAVE_MANIFEST_HASH" ] || [ "$SUPERSEDE_PREVIOUS_FIRST_WAVE" != "true" ]; then
              echo "BLOCKED: first-wave apply requires supersede=true, stable batch id, approved manifest hash, and PREPARE_APPROVED_FIRST_WAVE"
              exit 1
            fi
          elif [ "$MODE" = "apply" ] && [ "$GENERATION_SCOPE" = "custom" ] && [ "$CONFIRM" != "GENERATE_SYSTEM_OWNED_MEDIA" ]; then
            echo "BLOCKED: custom apply requires GENERATE_SYSTEM_OWNED_MEDIA"
            exit 1
          fi
      - name: Verify shared post and media design contracts
        run: |
          python3 scripts/test_generation_quality_gates.py
          python3 scripts/test_system_owned_media_plan_contract.py
          python3 scripts/test_first_wave_canary_contract.py
          python3 scripts/test_bounded_media_canary_plan.py
          python3 scripts/test_live_canary_inventory_contract.py
      - name: Supersede reviewed quality-failed first wave
        if: inputs.mode == 'apply' && inputs.supersede_previous_first_wave == true
        run: python3 scripts/supersede_quality_failed_first_wave.py --apply --confirm-supersede
      - name: Prepare exact first-wave batch
        if: inputs.generation_scope == 'first_wave'
        env:
          ALLOW_CLOUDINARY_UPLOAD: ${{ inputs.mode == 'apply' && inputs.confirm_first_wave == 'PREPARE_APPROVED_FIRST_WAVE' && 'true' || 'false' }}
        run: |
          set -o pipefail
          mkdir -p /tmp/system-owned-media
          if [ "$MODE" = "apply" ]; then
            python3 scripts/prepare_first_wave_canaries.py               --apply --use-sheets               --batch-id "$RESOLVED_FIRST_WAVE_BATCH_ID"               --expected-manifest-hash "$EXPECTED_FIRST_WAVE_MANIFEST_HASH"               --confirm-first-wave "$CONFIRM_FIRST_WAVE"               --output /tmp/system-owned-media/first-wave.json | tee /tmp/system-owned-media/first-wave-console.json
          else
            python3 scripts/prepare_first_wave_canaries.py               --dry-run --use-sheets               --batch-id "$RESOLVED_FIRST_WAVE_BATCH_ID"               --output /tmp/system-owned-media/first-wave.json | tee /tmp/system-owned-media/first-wave-console.json
          fi
      - name: Verify exact first-wave inventory after apply
        if: inputs.generation_scope == 'first_wave' && inputs.mode == 'apply'
        run: |
          python3 scripts/build_live_canary_inventory.py             --use-sheets --wave first_wave --batch-id "$RESOLVED_FIRST_WAVE_BATCH_ID"             --output /tmp/system-owned-media/first-wave-inventory.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('/tmp/system-owned-media/first-wave-inventory.json').read_text())
          expected_batch = os.environ['RESOLVED_FIRST_WAVE_BATCH_ID']
          assert data['same_batch_contract'] == 'PASS', data
          assert data['selected_batch_id'] == expected_batch, data
          assert all(row.get('batch_id') == expected_batch for row in data['canaries']), data
          assert data['total_canaries'] == 4 and data['ready_canaries'] == 4, data
          PY
      - name: Render, upload, and register custom system-owned media
        if: inputs.generation_scope == 'custom'
        env:
          ALLOW_CLOUDINARY_UPLOAD: ${{ inputs.mode == 'apply' && inputs.confirm_system_owned_media == 'GENERATE_SYSTEM_OWNED_MEDIA' && 'true' || 'false' }}
        run: |
          set -o pipefail
          mkdir -p /tmp/system-owned-media
          if [ "$MODE" = "apply" ]; then
            python3 scripts/run_system_owned_media_canaries.py --account-id "$ACCOUNT_ID" --content-types "$MEDIA_CONTENT_TYPES" --apply --confirm-system-owned-media | tee /tmp/system-owned-media/result.json
          else
            python3 scripts/run_system_owned_media_canaries.py --account-id "$ACCOUNT_ID" --content-types "$MEDIA_CONTENT_TYPES" --dry-run | tee /tmp/system-owned-media/result.json
          fi
      - name: Create custom fresh text canary queues
        if: inputs.generation_scope == 'custom'
        run: |
          if [ "$MODE" = "apply" ]; then
            python3 scripts/create_missing_text_canaries.py --targets "$TEXT_TARGETS" --apply --confirm-text-canaries --use-sheets | tee /tmp/system-owned-media/text-canaries.json
          else
            python3 scripts/create_missing_text_canaries.py --targets "$TEXT_TARGETS" --dry-run --use-sheets | tee /tmp/system-owned-media/text-canaries.json
          fi
      - name: Upload non-secret generation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-owned-media-${{ github.run_id }}
          path: /tmp/system-owned-media/*.json
          if-no-files-found: warn
          retention-days: 14
