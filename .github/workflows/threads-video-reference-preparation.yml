name: Threads Video Reference Preparation

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Reference candidates to prepare"
        required: true
        type: choice
        default: all
        options: [all, night_scout, liver_manager]
      confirm_preparation:
        description: "Type PREPARE_VIDEO_REFERENCES to persist source evidence and review candidates"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: sns-growth-threads-video-reference-preparation
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      ACCOUNT_ID: ${{ inputs.account_id }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-acquisition.txt
      - name: Install bounded acquisition and generation dependencies
        run: python3 -m pip install --requirement requirements-acquisition.txt
      - name: Guard review-only preparation
        run: |
          test "${{ inputs.confirm_preparation }}" = "PREPARE_VIDEO_REFERENCES"
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Acquire bounded Threads individual posts and ordered video metadata
        run: |
          python3 scripts/acquire_approved_source_posts_failsoft.py \
            --account-id "$ACCOUNT_ID" --platform threads --max-posts 12 \
            --reference-only --apply --confirm-acquisition
      - name: Create review-only candidates from video-post text and structure
        run: |
          accounts=(night_scout liver_manager)
          if [ "$ACCOUNT_ID" != "all" ]; then accounts=("$ACCOUNT_ID"); fi
          for account in "${accounts[@]}"; do
            python3 scripts/generate_threads_ideas_from_references.py \
              --account-id "$account" --platform threads --source references --top-n 3 \
              --post-type reference_text --video-only-reference \
              --apply --confirm-generate
          done
      - name: Refresh review board without publishing
        run: |
          python3 scripts/sync_publication_review.py \
            --apply --confirm-review-sync --use-sheets \
            --output /tmp/threads-video-reference-review.json
      - name: Upload preparation summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: threads-video-reference-preparation-${{ github.run_id }}
          path: /tmp/threads-video-reference-review.json
          if-no-files-found: warn
          retention-days: 14
