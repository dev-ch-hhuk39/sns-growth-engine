name: Production Autopilot Aftercare

on:
  schedule:
    # JST 23:40 daily. Runs after the scheduled posting windows.
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      confirm_aftercare:
        description: "Type true to run production aftercare writes"
        required: true
        default: "false"
      dry_run_only:
        description: "Run plans only; never write Sheets"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: sns-growth-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  aftercare:
    name: Metrics / PDCA / Schema / Health aftercare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT: ${{ secrets.THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Schedule heartbeat
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "event=${{ github.event_name }}"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve aftercare execution mode
        run: |
          apply=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            apply=true
          elif [ "${{ github.event.inputs.confirm_aftercare }}" = "true" ] && [ "${{ github.event.inputs.dry_run_only }}" != "true" ]; then
            apply=true
          fi
          echo "AFTERCARE_APPLY=$apply" >> "$GITHUB_ENV"
          echo "aftercare_apply=$apply" >> "$GITHUB_STEP_SUMMARY"

      - name: Guard aftercare config and secrets
        if: env.AFTERCARE_APPLY == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/production_autopilot.json").read_text())
          auto = json.loads(Path("config/autonomous_mode.json").read_text())
          if not cfg.get("production_autopilot_enabled"):
              raise SystemExit("[BLOCKED] production_autopilot_enabled=false")
          if auto.get("kill_switch"):
              raise SystemExit("[BLOCKED] autonomous kill_switch=true")
          print(
              "[OK] aftercare accepted before publish activation: "
              "production_autopilot_enabled=true kill_switch=false"
          )
          PY
          if [ -z "$SNS_MASTER_SHEET_ID" ] && [ -z "$SPREADSHEET_ID" ]; then
            echo "[BLOCKED] Sheets spreadsheet secret is missing."
            exit 1
          fi
          if [ -z "$SA_JSON_BASE64" ] && [ -z "$GCP_SA_JSON_BASE64" ]; then
            echo "[BLOCKED] Sheets service account secret is missing."
            exit 1
          fi

      - name: Dry-run aftercare plan
        run: |
          python3 scripts/process_threads_metric_jobs.py \
            --account-id all \
            --max-jobs 20 \
            --dry-run \
            --use-sheets

      - name: Apply metrics snapshots
        if: env.AFTERCARE_APPLY == 'true'
        run: |
          # Metrics may legitimately be PARTIAL/UNAVAILABLE before a platform
          # exposes public numbers. Record the result, then continue to the
          # PDCA and registry steps instead of making the whole aftercare fail.
          set +e
          python3 scripts/process_threads_metric_jobs.py \
            --account-id all \
            --max-jobs 20 \
            --apply \
            --confirm-metrics \
            --use-sheets
          metrics_exit=$?
          echo "metrics_snapshot_exit=$metrics_exit" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Sync source registry and Sheets schema
        if: env.AFTERCARE_APPLY == 'true'
        run: |
          python3 scripts/seed_source_registry.py \
            --apply \
            --confirm-seed \
            --skip-setup \
            --target-account all \
            --platform all

      - name: Explain measured outcomes and update bounded strategy
        if: env.AFTERCARE_APPLY == 'true'
        run: |
          python3 scripts/run_growth_attribution_cycle.py \
            --account-id all \
            --apply \
            --confirm-attribution \
            --use-sheets \
            --output /tmp/growth-attribution.json

      - name: Apply PDCA candidate generation (activation route)
        if: env.AFTERCARE_APPLY == 'true'
        run: |
          set +e
          for account in night_scout liver_manager; do
            python3 scripts/generate_threads_ideas_from_references.py \
              --account-id "$account" \
              --platform threads \
              --source references \
              --top-n 1 \
              --slot-id activation_pdca \
              --post-type pdca_text \
              --require-measured-pdca \
              --apply \
              --confirm-generate
            pdca_exit=$?
            echo "${account}_pdca_exit=$pdca_exit" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Health summary
        if: always()
        run: python3 scripts/check_autonomous_health.py --account-id all --dry-run --use-sheets
