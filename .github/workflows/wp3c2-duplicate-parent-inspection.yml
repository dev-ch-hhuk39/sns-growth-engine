name: CI WP3-C2 Duplicate Parent Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-growth-wp3c2-duplicate-parent-inspection
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  inspect_duplicate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Inspect Duplicate Parent
        run: |
          set +e
          python3 scripts/inspect_wp3c_duplicate_parent.py --output /tmp/wp3c2_inspect.json > /tmp/wp3c2_stdout.log
          INSPECT_EXIT=$?
          set -e
          
          LINE_COUNT=$(grep -c '^WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=' /tmp/wp3c2_stdout.log || true)
          if [ "$LINE_COUNT" -ne 1 ]; then
             echo "Error: Expected exactly 1 WP3C2_SAFE_DUPLICATE_INSPECTION_JSON= line, got $LINE_COUNT"
             exit 1
          fi
          
          PLAN_LINE=$(grep '^WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=' /tmp/wp3c2_stdout.log)
          PLAN_JSON=${PLAN_LINE#WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=}
          
          # output to file for python script
          printf '%s\n' "$PLAN_JSON" > /tmp/wp3c2_safe_plan.json
          
          # output line so parser can catch it
          printf 'WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=%s\n' "$PLAN_JSON"
          
          python3 scripts/render_wp3c2_inspection_summary.py \
            --json-input /tmp/wp3c2_safe_plan.json \
            --summary-output "$GITHUB_STEP_SUMMARY" \
            --exit-code "$INSPECT_EXIT"
