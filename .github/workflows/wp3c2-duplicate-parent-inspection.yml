name: CI WP3-C2 Duplicate Parent Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-growth-wp3c2-duplicate-parent-inspection
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  inspect_duplicate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Inspect Duplicate Parent
        run: |
          set +e
          python3 scripts/inspect_wp3c_duplicate_parent.py --output /tmp/wp3c2_inspect.json > /tmp/wp3c2_stdout.log
          INSPECT_EXIT=$?
          set -e
          
          LINE_COUNT=$(grep -c '^WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=' /tmp/wp3c2_stdout.log || true)
          if [ "$LINE_COUNT" -ne 1 ]; then
             echo "Error: Expected exactly 1 WP3C2_SAFE_DUPLICATE_INSPECTION_JSON= line, got $LINE_COUNT"
             exit 1
          fi
          
          PLAN_LINE=$(grep '^WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=' /tmp/wp3c2_stdout.log)
          PLAN_JSON=${PLAN_LINE#WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=}
          
          if ! echo "$PLAN_JSON" | jq . > /dev/null 2>&1; then
             echo "Error: Failed to parse safe JSON"
             exit 1
          fi
          
          echo "$PLAN_JSON" | sed 's/^/WP3C2_SAFE_DUPLICATE_INSPECTION_JSON=/'
          
          echo "## WP3-C2 Duplicate Parent Inspection Summary" >> $GITHUB_STEP_SUMMARY
          
          echo "### Overall Status" >> $GITHUB_STEP_SUMMARY
          echo "\`$(echo "$PLAN_JSON" | jq -r '.overall_status')\`" >> $GITHUB_STEP_SUMMARY
          
          echo "### Target Source Post ID" >> $GITHUB_STEP_SUMMARY
          echo "\`$(echo "$PLAN_JSON" | jq -r '.target_source_post_id')\`" >> $GITHUB_STEP_SUMMARY
          
          echo "### Sheets Verifier" >> $GITHUB_STEP_SUMMARY
          echo "$PLAN_JSON" | jq -r '.sheets_verifier | "- Passed: \(.passed // 0)\n- Total: \(.total // 0)\n- Basis: \(.total_basis // \"\")"' >> $GITHUB_STEP_SUMMARY
          
          echo "### Candidates (\($(echo "$PLAN_JSON" | jq -r '.parent_candidate_count')\))" >> $GITHUB_STEP_SUMMARY
          echo "$PLAN_JSON" | jq -r '
            .parent_candidates[]? |
            "- **Candidate #\(.candidate_number)** (Row \(.sheet_row_number))\n" +
            "  - Account: \(.account_id)\n" +
            "  - Declared Media: \(.declared_media_count)\n" +
            "  - Has Canonical URL: \(.has_canonical_post_url)\n" +
            "  - Has Canonical Identity Hash: \(if (.canonical_identity_hash // \"\") != \"\" then true else false end)\n" +
            "  - Required Fields: \(.required_field_presence_count)\n" +
            "  - Has Parent Precondition Hash: \(if (.parent_precondition_hash // \"\") != \"\" then true else false end)\n" +
            "  - Canonical Match Children: \(.canonical_matching_child_count)\n" +
            "  - Mismatch Child IDs: \((.canonical_mismatching_child_ids // []) | join(\", \"))\n" +
            "  - Material Diffs: \((.material_difference_fields // []) | join(\", \"))\n" +
            "  - Disposition: \(.recommended_disposition)\n" +
            "  - Blockers: \((.blocker_codes // []) | join(\", \"))"
          ' >> $GITHUB_STEP_SUMMARY
          
          echo "### Child Summary (\($(echo "$PLAN_JSON" | jq -r '.child_summary.child_count')\))" >> $GITHUB_STEP_SUMMARY
          echo "$PLAN_JSON" | jq -r '
            .child_summary |
            "- Unique IDs: \(.unique_child_id_count)\n" +
            "- Duplicate Media Indexes: \((.duplicate_media_indexes // []) | join(\", \"))"
          ' >> $GITHUB_STEP_SUMMARY
          
          echo "### Decision" >> $GITHUB_STEP_SUMMARY
          echo "- Recommended Keep Row: \($(echo "$PLAN_JSON" | jq -r '.recommended_keep_sheet_row_number')\)" >> $GITHUB_STEP_SUMMARY
          echo "- Manual Delete Rows: $(echo "$PLAN_JSON" | jq -r '(.manual_delete_candidate_sheet_row_numbers // []) | join(\", \")')" >> $GITHUB_STEP_SUMMARY
          
          exit "$INSPECT_EXIT"
