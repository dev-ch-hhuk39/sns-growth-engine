name: Refresh Threads Tokens

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account to refresh (all / night_scout / liver_manager / beauty_account)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - night_scout
          - liver_manager
          - beauty_account
      dry_run:
        description: "Dry run — no actual refresh, no secret update"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # 毎週日曜 2:00 UTC (11:00 JST) — 60日期限の 45日前リフレッシュ目安
    - cron: "0 2 * * 0"

concurrency:
  group: refresh-threads-tokens
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    # The running publisher reads the shared token store first.  Refresh in
    # that same VPS environment so a 60-day rotation does not leave it with a
    # stale token while GitHub Secrets have already been updated.
    runs-on: [self-hosted, Linux, X64]
    environment: production
    env:
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT }}
      THREADS_APP_ID_NIGHT_SCOUT: ${{ secrets.THREADS_APP_ID_NIGHT_SCOUT }}
      THREADS_APP_SECRET_NIGHT_SCOUT: ${{ secrets.THREADS_APP_SECRET_NIGHT_SCOUT }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}
      THREADS_APP_ID_LIVER_MANAGER: ${{ secrets.THREADS_APP_ID_LIVER_MANAGER }}
      THREADS_APP_SECRET_LIVER_MANAGER: ${{ secrets.THREADS_APP_SECRET_LIVER_MANAGER }}
      THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT: ${{ secrets.THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT }}
      THREADS_USER_ID_BEAUTY_ACCOUNT: ${{ secrets.THREADS_USER_ID_BEAUTY_ACCOUNT }}
      THREADS_APP_ID_BEAUTY_ACCOUNT: ${{ secrets.THREADS_APP_ID_BEAUTY_ACCOUNT }}
      THREADS_APP_SECRET_BEAUTY_ACCOUNT: ${{ secrets.THREADS_APP_SECRET_BEAUTY_ACCOUNT }}
      THREADS_TOKEN_STORE_DIR: /opt/github-runners/sns-growth-engine/.buffered-runtime/shared/threads_tokens

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      # ---- パラメータ決定 ----
      # scheduled run は account=all, dry_run=false を既定値とする
      - name: Resolve parameters
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ACCOUNT=all"   >> "$GITHUB_ENV"
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          else
            echo "ACCOUNT=${{ github.event.inputs.account }}" >> "$GITHUB_ENV"
            echo "DRY_RUN=${{ github.event.inputs.dry_run }}" >> "$GITHUB_ENV"
          fi

      - name: Bootstrap pinned GitHub CLI
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "ERROR: pinned GitHub CLI bootstrap supports only Linux x86_64 runners."
            exit 1
          fi
          version="2.101.0"
          expected_sha256="9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8"
          archive="$RUNNER_TEMP/gh_${version}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/gh-${version}"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \
            "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir"
          cli_path="$install_dir/gh_${version}_linux_amd64/bin"
          test -x "$cli_path/gh"
          echo "$cli_path" >> "$GITHUB_PATH"
          rm -f "$archive"
          echo "Pinned GitHub CLI ${version} installed in runner temp storage."

      # ---- GH_SECRET_WRITE_TOKEN の確認 ----
      - name: Verify GH_SECRET_WRITE_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          _GH_TOKEN_SET: ${{ secrets.GH_SECRET_WRITE_TOKEN != '' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY_RUN=true: GitHub Secret更新権限の確認をスキップ"
            exit 0
          fi
          if [ "$_GH_TOKEN_SET" != "true" ]; then
            echo "READY_WITH_MISSING_GH_SECRET_WRITE_TOKEN: GH_SECRET_WRITE_TOKEN が GitHub Secrets に設定されていません。"
            echo "  Settings → Secrets and variables → Actions → GH_SECRET_WRITE_TOKEN を追加してください。"
            echo "  必要なスコープ: secrets:write"
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1 || [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: GitHub CLI or secret-write credential is unavailable; refresh was not attempted."
            exit 1
          fi
          gh --version | head -n 1

      - name: Preflight GitHub Secret write capability
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          probe_name="SNS_GH_SECRET_WRITE_PREFLIGHT_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          probe_file="$RUNNER_TEMP/gh-secret-write-probe"
          cleanup() {
            rm -f "$probe_file"
            gh secret delete "$probe_name" --env production --repo "$GH_REPO" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          umask 077
          openssl rand -hex 32 > "$probe_file"
          gh secret set "$probe_name" --env production --repo "$GH_REPO" < "$probe_file" >/dev/null
          if ! gh secret list --env production --repo "$GH_REPO" --json name --jq '.[].name' | grep -Fxq "$probe_name"; then
            echo "ERROR: temporary GitHub Secret write could not be read back; refresh was not attempted."
            exit 1
          fi
          gh secret delete "$probe_name" --env production --repo "$GH_REPO" >/dev/null
          if gh secret list --env production --repo "$GH_REPO" --json name --jq '.[].name' | grep -Fxq "$probe_name"; then
            echo "ERROR: temporary GitHub Secret cleanup could not be verified; refresh was not attempted."
            exit 1
          fi
          trap - EXIT
          rm -f "$probe_file"
          echo "GitHub Secret write and cleanup capability: PASS"

      - name: Preflight current Threads tokens
        if: env.DRY_RUN == 'false'
        run: |
          set -euo pipefail
          case "$ACCOUNT" in
            all) accounts="night_scout liver_manager beauty_account" ;;
            night_scout|liver_manager|beauty_account) accounts="$ACCOUNT" ;;
            *) echo "ERROR: unsupported account selection; refresh was not attempted."; exit 1 ;;
          esac
          for account in $accounts; do
            python3 scripts/refresh_threads_token.py --account-id "$account" --dry-run
          done

      # ============================================================
      # night_scout
      # ============================================================
      - name: "[night_scout] Refresh token"
        if: env.ACCOUNT == 'all' || env.ACCOUNT == 'night_scout'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/refresh_threads_token.py --account-id night_scout --dry-run
          else
            python3 scripts/refresh_threads_token.py --account-id night_scout --confirm-refresh
          fi

      - name: "[night_scout] Update GitHub Secret"
        if: (env.ACCOUNT == 'all' || env.ACCOUNT == 'night_scout') && env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$THREADS_TOKEN_STORE_DIR/night_scout.json"
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "ERROR: $TOKEN_FILE が見つかりません。リフレッシュが成功しなかった可能性があります。"
            exit 1
          fi
          if [ "$(stat -c '%a' "$TOKEN_FILE")" != "600" ]; then
            echo "ERROR: refreshed token file permissions are not 0600."
            exit 1
          fi
          jq -er '. | select(.account_id == "night_scout") | .access_token | strings | select(length > 0)' "$TOKEN_FILE" \
            | gh secret set THREADS_ACCESS_TOKEN_NIGHT_SCOUT --env production --repo "$GH_REPO" >/dev/null
          gh secret list --env production --repo "$GH_REPO" --json name,updatedAt --jq '.[] | select(.name == "THREADS_ACCESS_TOKEN_NIGHT_SCOUT" and (.updatedAt | length > 0)) | .name' \
            | grep -Fxq THREADS_ACCESS_TOKEN_NIGHT_SCOUT
          echo "GitHub Secret THREADS_ACCESS_TOKEN_NIGHT_SCOUT: 更新完了"

      # ============================================================
      # liver_manager
      # ============================================================
      - name: "[liver_manager] Refresh token"
        if: env.ACCOUNT == 'all' || env.ACCOUNT == 'liver_manager'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/refresh_threads_token.py --account-id liver_manager --dry-run
          else
            python3 scripts/refresh_threads_token.py --account-id liver_manager --confirm-refresh
          fi

      - name: "[liver_manager] Update GitHub Secret"
        if: (env.ACCOUNT == 'all' || env.ACCOUNT == 'liver_manager') && env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$THREADS_TOKEN_STORE_DIR/liver_manager.json"
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "ERROR: $TOKEN_FILE が見つかりません。リフレッシュが成功しなかった可能性があります。"
            exit 1
          fi
          if [ "$(stat -c '%a' "$TOKEN_FILE")" != "600" ]; then
            echo "ERROR: refreshed token file permissions are not 0600."
            exit 1
          fi
          jq -er '. | select(.account_id == "liver_manager") | .access_token | strings | select(length > 0)' "$TOKEN_FILE" \
            | gh secret set THREADS_ACCESS_TOKEN_LIVER_MANAGER --env production --repo "$GH_REPO" >/dev/null
          gh secret list --env production --repo "$GH_REPO" --json name,updatedAt --jq '.[] | select(.name == "THREADS_ACCESS_TOKEN_LIVER_MANAGER" and (.updatedAt | length > 0)) | .name' \
            | grep -Fxq THREADS_ACCESS_TOKEN_LIVER_MANAGER
          echo "GitHub Secret THREADS_ACCESS_TOKEN_LIVER_MANAGER: 更新完了"

      # ============================================================
      # beauty_account
      # ============================================================
      - name: "[beauty_account] Refresh token"
        if: env.ACCOUNT == 'all' || env.ACCOUNT == 'beauty_account'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/refresh_threads_token.py --account-id beauty_account --dry-run
          else
            python3 scripts/refresh_threads_token.py --account-id beauty_account --confirm-refresh
          fi

      - name: "[beauty_account] Update GitHub Secret"
        if: (env.ACCOUNT == 'all' || env.ACCOUNT == 'beauty_account') && env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +x
          TOKEN_FILE="$THREADS_TOKEN_STORE_DIR/beauty_account.json"
          if [ ! -f "$TOKEN_FILE" ]; then
            echo "ERROR: $TOKEN_FILE が見つかりません。リフレッシュが成功しなかった可能性があります。"
            exit 1
          fi
          if [ "$(stat -c '%a' "$TOKEN_FILE")" != "600" ]; then
            echo "ERROR: refreshed token file permissions are not 0600."
            exit 1
          fi
          jq -er '. | select(.account_id == "beauty_account") | .access_token | strings | select(length > 0)' "$TOKEN_FILE" \
            | gh secret set THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT --env production --repo "$GH_REPO" >/dev/null
          gh secret list --env production --repo "$GH_REPO" --json name,updatedAt --jq '.[] | select(.name == "THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT" and (.updatedAt | length > 0)) | .name' \
            | grep -Fxq THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT
          echo "GitHub Secret THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT: 更新完了"

      # ============================================================
      # 通知
      # ============================================================
      - name: "Notify Discord (success)"
        if: success() && !cancelled()
        env:
          _WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          _REPO: ${{ github.repository }}
        run: |
          if [ -z "$_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL 未設定 — 通知スキップ"
            exit 0
          fi
          MSG="✅ Threads token refresh 完了 (account=${ACCOUNT} dry_run=${DRY_RUN} repo=${_REPO})"
          # jq で JSON エスケープしてから送信
          jq -n --arg content "$MSG" '{"content": $content}' \
            | curl -sf -X POST "$_WEBHOOK" -H "Content-Type: application/json" -d @- || true

      - name: "Notify Discord (failure)"
        if: failure()
        env:
          _WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL 未設定 — 通知スキップ"
            exit 0
          fi
          MSG="❌ Threads token refresh 失敗 (account=${ACCOUNT} dry_run=${DRY_RUN}) — GitHub Actions ログを確認してください"
          jq -n --arg content "$MSG" '{"content": $content}' \
            | curl -sf -X POST "$_WEBHOOK" -H "Content-Type: application/json" -d @- || true
