name: Repair Canary Source Integrity

on:
  workflow_dispatch:
    inputs:
      confirm_canary_source_repair:
        description: "Type REPAIR_CANARY_SOURCE_IDENTITIES to update only the two direct-video parents"
        required: true
        default: ""

permissions:
  contents: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_MEDIA_POSTS: "false"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
      ALLOW_SHEETS_IDENTITY_REPAIR: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-acquisition.txt
      - name: Install Sheets dependencies
        run: python3 -m pip install --requirement requirements-acquisition.txt
      - name: Guard exact repair confirmation
        run: |
          test "${{ inputs.confirm_canary_source_repair }}" = "REPAIR_CANARY_SOURCE_IDENTITIES"
      - name: Repair selected direct-video source identities
        run: |
          mkdir -p /tmp/canary-source-integrity
          python3 scripts/repair_canary_direct_video_identities.py --apply --confirm-canary-source-repair --output /tmp/canary-source-integrity/repair.json
      - name: Re-read final readiness
        if: always()
        run: python3 scripts/final_production_readiness.py --use-sheets --output /tmp/canary-source-integrity/readiness.json || true
      - name: Upload repair receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-source-integrity-${{ github.run_id }}
          path: /tmp/canary-source-integrity/*.json
          retention-days: 14
