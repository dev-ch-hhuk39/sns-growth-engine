name: Audit Existing Canary Evidence
on:
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      PUBLISH_ENABLED: "false"
      ALLOW_REAL_THREADS_POST: "false"
      ALLOW_REAL_X_POST: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - run: python3 -m pip install --requirement requirements.txt
      - run: mkdir -p /tmp/existing-canary
      - run: python3 scripts/audit_existing_canary_evidence.py --apply --confirm-existing-evidence --output /tmp/existing-canary/audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: existing-canary-evidence-${{ github.run_id }}
          path: /tmp/existing-canary/audit.json
          retention-days: 30
