name: Autopilot AUTO_READY Pilot

# Scheduled AUTO_READY pilot.
# This workflow may promote safe Threads queue rows to READY, but it never posts.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: "Target account scope"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "night_scout"
          - "liver_manager"
          - "beauty_account"
      horizon_hours:
        description: "Manual no-post verification scope: 6h bounded, or usual 24h"
        required: true
        default: "24"
        type: choice
        options: ["6", "24"]
      max_ready:
        description: "Maximum rows to promote to READY"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      confirm_auto_ready:
        description: "Type true to write AUTO_READY rows after final production activation"
        required: true
        default: "false"

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  DRY_RUN: "false"
  MOCK_LLM: "false"
  MOCK_SHEETS: "false"

jobs:
  auto-ready:
    name: AUTO_READY without posting
    strategy:
      fail-fast: false
      # Keep all existing verification gates; serialize shared Sheets access.
      max-parallel: 1
      matrix:
        account_id: ${{ fromJSON(github.event.inputs.account_id && github.event.inputs.account_id != 'all' && format('["{0}"]', github.event.inputs.account_id) || '["night_scout","liver_manager","beauty_account"]') }}
    concurrency:
      group: sns-growth-buffer-preparation-${{ matrix.account_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120

    env:
      ACCOUNT_ID: ${{ matrix.account_id }}
      MAX_READY: ${{ github.event.inputs.max_ready || '1' }}
      HORIZON_HOURS: ${{ github.event.inputs.horizon_hours || '24' }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Resolve scheduled inventory maintenance
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm_auto_ready }}
        run: |
          apply=false
          max_ready="$MAX_READY"
          case "$HORIZON_HOURS" in
            6|24) ;;
            *) echo "[BLOCKED] unsupported horizon"; exit 2 ;;
          esac
          if [ "${{ github.event_name }}" = "schedule" ]; then
            apply=true
            max_ready=3
          elif [ "$MANUAL_CONFIRM" = "true" ]; then
            apply=true
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HORIZON_HOURS" != "24" ]; then
            echo "[BLOCKED] scheduled horizon must remain 24h"
            exit 2
          fi
          echo "AUTO_READY_APPLY=$apply" >> "$GITHUB_ENV"
          echo "MAX_READY=$max_ready" >> "$GITHUB_ENV"

      - name: Verify isolated legacy text AUTO_READY and preserve V2 draft-only
        if: env.AUTO_READY_APPLY == 'true'
        shell: bash
        run: |
          python3 scripts/auto_ready_draft_preflight.py --autonomous-text-only --account-id "$ACCOUNT_ID"

      - name: Install dependencies
        # Manual plan-only previews use the same pinned runtime, never a writer.
        if: env.AUTO_READY_APPLY == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Preview exact-slot READY with no Sheets writes
        if: github.event_name == 'workflow_dispatch' && env.AUTO_READY_APPLY != 'true'
        run: |
          # Never emit full queue JSON or provider stderr to public Actions.
          # No confirm/apply arguments are allowed in this branch.
          if [ -z "$SNS_MASTER_SHEET_ID" ] && [ -z "$SPREADSHEET_ID" ]; then
            echo "[BLOCKED] read-only Sheets spreadsheet secret missing"
            exit 1
          fi
          if [ -z "$SA_JSON_BASE64" ] && [ -z "$GCP_SA_JSON_BASE64" ]; then
            echo "[BLOCKED] read-only service account secret missing"
            exit 1
          fi
          ready_report="$(mktemp)"
          ready_stderr="$(mktemp)"
          trap 'rm -f "$ready_report" "$ready_stderr"' EXIT
          if ! python3 scripts/maintain_text_ready_inventory.py \
            --account-id "$ACCOUNT_ID" --dry-run --use-sheets \
            --horizon-hours "$HORIZON_HOURS" > "$ready_report" 2> "$ready_stderr"; then
            python3 scripts/ready_inventory_diagnostics.py \
              --account-id "$ACCOUNT_ID" --report "$ready_report" \
              --private-stderr "$ready_stderr" || true
            echo "[OPERATIONAL_FAILURE] read-only READY coverage failed; no writes or SNS post"
            exit 1
          fi
          python3 scripts/ready_inventory_diagnostics.py \
            --account-id "$ACCOUNT_ID" --report "$ready_report" \
              --private-stderr "$ready_stderr"

      - name: Guard account and Sheets secrets
        id: preparation_guard
        if: env.AUTO_READY_APPLY == 'true'
        run: |
          if [ "$ACCOUNT_ID" != "all" ] && [ "$ACCOUNT_ID" != "night_scout" ] && [ "$ACCOUNT_ID" != "liver_manager" ] && [ "$ACCOUNT_ID" != "beauty_account" ]; then
            echo "[BLOCKED] unsupported account"
            exit 1
          fi
          if [ -z "$SNS_MASTER_SHEET_ID" ] && [ -z "$SPREADSHEET_ID" ]; then
            echo "[BLOCKED] Sheets spreadsheet secret is missing."
            exit 1
          fi
          if [ -z "$SA_JSON_BASE64" ] && [ -z "$GCP_SA_JSON_BASE64" ]; then
            echo "[BLOCKED] Sheets service account secret is missing."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("config/autonomous_mode.json").read_text())
          if config.get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          if not config.get("production_publish_activation_approved", False):
              raise SystemExit("[BLOCKED] production_publish_activation_approved=false")
          PY

      - name: Verify Sheets before AUTO_READY
        if: env.AUTO_READY_APPLY == 'true'
        run: python3 scripts/recover_production_sheets_threads_first.py --verify-only --text-inventory-scope

      - name: Maintain next text-slot READY inventory
        if: env.AUTO_READY_APPLY == 'true'
        run: |
          # The queue report contains unpublished queue identifiers.
          # Only the existing allowlisted diagnostics may reach public CI.
          ready_report="$(mktemp)"
          ready_stderr="$(mktemp)"
          trap 'rm -f "$ready_report" "$ready_stderr"' EXIT
          if ! python3 scripts/maintain_text_ready_inventory.py \
            --account-id "$ACCOUNT_ID" --apply \
            --confirm-ready-maintenance --use-sheets \
            --horizon-hours "$HORIZON_HOURS" > "$ready_report" 2> "$ready_stderr"; then
            python3 scripts/ready_inventory_diagnostics.py \
              --account-id "$ACCOUNT_ID" --report "$ready_report" \
              --private-stderr "$ready_stderr" || true
            echo "[OPERATIONAL_FAILURE] exact-slot READY coverage failed (redacted)"
            exit 1
          fi
          python3 scripts/ready_inventory_diagnostics.py \
            --account-id "$ACCOUNT_ID" --report "$ready_report" \
              --private-stderr "$ready_stderr"

      - name: Refill validated non-AI emergency bank
        id: evergreen_refill
        # Preserve the bank failure signal, but allow the independent safe
        # delivery/verify path to complete before the job fails operationally.
        continue-on-error: true
        # Manual 6h no-post canary does not run long evergreen-bank top-up.
        if: success() && env.AUTO_READY_APPLY == 'true' && env.HORIZON_HOURS == '24' && steps.preparation_guard.outcome == 'success'
        run: |
          bank_report="$(mktemp)"
          bank_stderr="$(mktemp)"
          trap 'rm -f "$bank_report" "$bank_stderr"' EXIT
          if ! python3 scripts/maintain_text_ready_inventory.py \
            --account-id "$ACCOUNT_ID" --evergreen-bank --apply \
            --confirm-ready-maintenance --use-sheets > "$bank_report" 2> "$bank_stderr"; then
            python3 scripts/ready_evergreen_bank_summary.py \
              --account-id "$ACCOUNT_ID" --report "$bank_report" \
              --private-stderr "$bank_stderr" || true
            echo "[OPERATIONAL_FAILURE] evergreen reserve not verified (redacted)"
            exit 1
          fi
          python3 scripts/ready_evergreen_bank_summary.py \
            --account-id "$ACCOUNT_ID" --report "$bank_report" \
              --private-stderr "$bank_stderr"

      - name: Verify Sheets after failed evergreen reserve
        if: env.AUTO_READY_APPLY == 'true' && steps.evergreen_refill.outcome == 'failure'
        run: python3 scripts/recover_production_sheets_threads_first.py --verify-only --text-inventory-scope

      - name: AUTO_READY apply only
        if: env.AUTO_READY_APPLY == 'true'
        run: |
          python3 scripts/run_autopilot_loop.py \
            --apply \
            --confirm-run \
            --account-id "$ACCOUNT_ID" \
            --auto-ready \
            --max-ready "$MAX_READY" \
            --max-posts 1 \
            --use-sheets \
            --skip-real-post \
            --summary-only

      - name: Verify Sheets after AUTO_READY
        if: env.AUTO_READY_APPLY == 'true'
        run: python3 scripts/recover_production_sheets_threads_first.py --verify-only --text-inventory-scope

      - name: Report failed evergreen reserve after delivery check
        if: always() && env.AUTO_READY_APPLY == 'true' && steps.evergreen_refill.outcome == 'failure'
        run: |
          echo "[OPERATIONAL_FAILURE] evergreen bank below canonical slot target; no SNS post"
          exit 1
