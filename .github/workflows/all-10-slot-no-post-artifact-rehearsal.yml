name: All 10 Slot No-Post Artifact Rehearsal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  SCHEDULED_AUTOPOST_PREVIEW_V2_OUTPUT: /tmp/all10-preview.json

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout triggering main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install read-only rehearsal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python3 -m pip install --requirement requirements-acquisition.txt
          command -v ffmpeg
          command -v ffprobe
          command -v yt-dlp

      - name: Verify required secrets exist without printing values
        run: |
          set -euo pipefail
          test -n "$SNS_MASTER_SHEET_ID$SPREADSHEET_ID"
          test -n "$SA_JSON_BASE64$GCP_SA_JSON_BASE64"
          test -n "$GEMINI_API_KEY"
          echo "required_secret_presence=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Run production-data 10-slot Preview v2
        run: python3 scripts/run_scheduled_autopost_preview_v2.py

      - name: Build human-reviewable artifact bundle
        run: |
          python3 - <<'PY'
          import json
          import mimetypes
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          report_path = Path('/tmp/all10-preview.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          root = Path('/tmp/all10-artifacts')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'preview_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')

          slots = report.get('slots') or []
          manifest = []
          summary = [
              '# All 10 Slot No-Post Production Rehearsal',
              '',
              f"preview_status: {report.get('status')}",
              f"slot_count: {report.get('slot_count')}",
              f"would_post: {report.get('would_post')}",
              f"writes_performed: {report.get('writes_performed')}",
              f"queue_unchanged: {report.get('queue_unchanged')}",
              f"protected_rows_unchanged: {report.get('protected_rows_unchanged')}",
              '',
          ]

          def safe_name(value):
              return re.sub(r'[^A-Za-z0-9._-]+', '_', str(value or 'unknown'))

          def download_http(url, target_base, max_bytes=120 * 1024 * 1024):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 no-post-rehearsal'})
              with urllib.request.urlopen(req, timeout=90) as resp:
                  length = resp.headers.get('Content-Length')
                  if length and int(length) > max_bytes:
                      raise RuntimeError(f'media_too_large:{length}')
                  ctype = (resp.headers.get('Content-Type') or '').split(';', 1)[0].strip().lower()
                  ext = mimetypes.guess_extension(ctype) or Path(urllib.parse.urlparse(url).path).suffix or '.bin'
                  if ext == '.jpe':
                      ext = '.jpg'
                  target = target_base.with_suffix(ext[:8])
                  total = 0
                  with target.open('wb') as fh:
                      while True:
                          chunk = resp.read(1024 * 1024)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > max_bytes:
                              raise RuntimeError('media_stream_exceeded_size_cap')
                          fh.write(chunk)
                  return target, ctype, total

          for slot in slots:
              account = str(slot.get('account_id') or 'unknown')
              slot_id = str(slot.get('slot_id') or 'unknown')
              post_type = str(slot.get('post_type') or 'unknown')
              status = str(slot.get('status') or '')
              slot_dir = root / safe_name(account) / safe_name(slot_id)
              slot_dir.mkdir(parents=True, exist_ok=True)
              (slot_dir / 'slot.json').write_text(json.dumps(slot, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
              (slot_dir / 'status.txt').write_text(status + '\n', encoding='utf-8')
              final_text = str(slot.get('final_text') or '')
              (slot_dir / 'final_text.txt').write_text(final_text + ('\n' if final_text else ''), encoding='utf-8')

              reasons = []
              for key in ('blocked_reasons', 'preview_blocked_reasons', 'lineage_flags'):
                  value = slot.get(key)
                  if isinstance(value, list):
                      reasons.extend(str(x) for x in value if str(x))
              gemini = slot.get('gemini') if isinstance(slot.get('gemini'), dict) else {}
              reasons.extend(str(x) for x in gemini.get('blocked_reasons', []) if str(x))
              plan = slot.get('plan') if isinstance(slot.get('plan'), dict) else {}
              for key in ('blocked_reasons', 'reasons'):
                  value = plan.get(key)
                  if isinstance(value, list):
                      reasons.extend(str(x) for x in value if str(x))
              reasons = sorted(set(reasons))
              (slot_dir / 'reasons.txt').write_text('\n'.join(reasons) + ('\n' if reasons else ''), encoding='utf-8')

              media_files = []
              media_notes = []
              if post_type == 'direct_reference_media':
                  candidate = slot.get('candidate') if isinstance(slot.get('candidate'), dict) else {}
                  urls = []
                  primary = str(candidate.get('media_url') or '').strip()
                  if primary:
                      urls.append(primary)
                  plan_urls = plan.get('media_urls')
                  if isinstance(plan_urls, list):
                      urls.extend(str(x).strip() for x in plan_urls if str(x).strip())
                  deduped = []
                  for url in urls:
                      if url.startswith(('http://', 'https://')) and url not in deduped:
                          deduped.append(url)
                  (slot_dir / 'media_urls.json').write_text(json.dumps(deduped, ensure_ascii=False, indent=2), encoding='utf-8')
                  for idx, url in enumerate(deduped, start=1):
                      try:
                          path, ctype, size = download_http(url, slot_dir / f'direct_media_{idx}')
                          media_files.append(str(path.relative_to(root)))
                          media_notes.append(f'downloaded {path.name} content_type={ctype} bytes={size}')
                      except Exception as exc:
                          media_notes.append(f'download_failed url_index={idx} error={type(exc).__name__}:{exc}')

              elif post_type == 'approved_source_clip':
                  source_url = str(slot.get('source_video_url') or '').strip()
                  start = slot.get('clip_start_seconds')
                  end = slot.get('clip_end_seconds')
                  (slot_dir / 'source_video_url.txt').write_text(source_url + ('\n' if source_url else ''), encoding='utf-8')
                  (slot_dir / 'clip_range.txt').write_text(f'{start}-{end}\n', encoding='utf-8')
                  if source_url.startswith(('http://', 'https://')) and start not in (None, '') and end not in (None, ''):
                      try:
                          start_f = float(start)
                          end_f = float(end)
                          if not (0 <= start_f < end_f and (end_f - start_f) <= 60):
                              raise RuntimeError('invalid_or_oversized_clip_range')
                          out_template = str(slot_dir / 'clip_rehearsal.%(ext)s')
                          cmd = [
                              'yt-dlp', '--no-playlist', '--no-progress',
                              '--download-sections', f'*{start_f}-{end_f}',
                              '--force-keyframes-at-cuts',
                              '--merge-output-format', 'mp4',
                              '-f', 'bv*+ba/b', '-o', out_template, source_url,
                          ]
                          completed = subprocess.run(cmd, text=True, capture_output=True, timeout=180, check=False)
                          (slot_dir / 'clip_render_stdout.txt').write_text(completed.stdout[-8000:], encoding='utf-8')
                          (slot_dir / 'clip_render_stderr.txt').write_text(completed.stderr[-8000:], encoding='utf-8')
                          if completed.returncode != 0:
                              raise RuntimeError(f'yt_dlp_returncode_{completed.returncode}')
                          rendered = sorted(slot_dir.glob('clip_rehearsal.*'))
                          if not rendered:
                              raise RuntimeError('clip_output_missing')
                          for path in rendered:
                              media_files.append(str(path.relative_to(root)))
                          media_notes.append('clip_render=PASS')
                      except Exception as exc:
                          media_notes.append(f'clip_render=FAILED error={type(exc).__name__}:{exc}')
                  else:
                      media_notes.append('clip_render=NOT_AVAILABLE no eligible production clip candidate/source range')

              (slot_dir / 'media_artifact_status.txt').write_text('\n'.join(media_notes) + ('\n' if media_notes else 'not_applicable\n'), encoding='utf-8')
              entry = {
                  'account_id': account,
                  'slot_id': slot_id,
                  'post_type': post_type,
                  'status': status,
                  'final_text_present': bool(final_text),
                  'reasons': reasons,
                  'media_files': media_files,
              }
              manifest.append(entry)
              summary.extend([
                  f'## {account} / {slot_id}',
                  f'- type: {post_type}',
                  f'- status: {status}',
                  f'- final_text_present: {bool(final_text)}',
                  f'- media_files: {len(media_files)}',
                  f"- reasons: {', '.join(reasons) if reasons else 'none'}",
                  '',
                  final_text[:1500] if final_text else '(no final text candidate)',
                  '',
              ])

          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          (root / 'SUMMARY.md').write_text('\n'.join(summary), encoding='utf-8')

          hard = []
          if int(report.get('slot_count') or 0) != 10:
              hard.append('slot_count_not_10')
          if report.get('would_post') is not False:
              hard.append('would_post_not_false')
          if report.get('writes_performed') is not False:
              hard.append('writes_performed_not_false')
          if report.get('queue_unchanged') is not True:
              hard.append('queue_changed')
          if report.get('protected_rows_unchanged') is not True:
              hard.append('protected_rows_changed')
          (root / 'HARD_ERRORS.json').write_text(json.dumps(hard, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'artifact_root': str(root), 'hard_errors': hard, 'slot_count': len(slots)}, ensure_ascii=False))
          if hard:
              raise SystemExit('hard rehearsal safety failure: ' + ','.join(hard))
          PY

      - name: Upload 10-slot rehearsal bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-10-slot-no-post-rehearsal
          path: /tmp/all10-artifacts
          if-no-files-found: error
          retention-days: 7
