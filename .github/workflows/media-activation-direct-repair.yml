name: Media Activation Direct Repair

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Exact account whose permissioned Direct media should be repaired"
        required: true
        type: choice
        options:
          - liver_manager
          - night_scout
      source_post_id:
        description: "Exact selected source_post_id from the repair manifest"
        required: true
        type: string
      source_post_media_id:
        description: "Exact source_post_media_id targeted by the repair manifest"
        required: true
        type: string
      expected_manifest_hash:
        description: "Exact 64-character manifest hash from the read-only preflight"
        required: true
        type: string
      confirm_repair:
        description: "Type true to perform exact download, understanding and Cloudinary repair"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

concurrency:
  group: sns-growth-media-activation-direct-repair-${{ github.event.inputs.account_id }}
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_LOCAL_TRANSCRIPTION: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  GITHUB_MODELS_ENABLED: "false"
  ENABLE_SENTENCE_TRANSFORMERS: "false"

jobs:
  repair-exact-direct-media:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    env:
      ACCOUNT_ID: ${{ github.event.inputs.account_id }}
      SOURCE_POST_ID: ${{ github.event.inputs.source_post_id }}
      SOURCE_POST_MEDIA_ID: ${{ github.event.inputs.source_post_media_id }}
      EXPECTED_MANIFEST_HASH: ${{ github.event.inputs.expected_manifest_hash }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-media-runtime.txt

      - name: Install exact repair dependencies
        run: python3 -m pip install --requirement requirements-media-runtime.txt

      - name: Install bounded local media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg \
            tesseract-ocr \
            tesseract-ocr-jpn
          command -v ffmpeg
          command -v ffprobe
          command -v tesseract

      - name: Verify kill switch and required secrets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(
              Path("config/autonomous_mode.json").read_text(
                  encoding="utf-8"
              )
          )
          if config.get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          print("[OK] kill_switch=false")
          PY
          for name in \
            SNS_MASTER_SHEET_ID \
            SA_JSON_BASE64 \
            CLOUDINARY_CLOUD_NAME \
            CLOUDINARY_API_KEY \
            CLOUDINARY_API_SECRET
          do
            if test -z "${!name}"
            then
              echo "[BLOCKED] required secret is missing: $name"
              exit 1
            fi
          done
          echo "[OK] exact repair secrets are present"

      - name: Read-only exact repair preflight
        run: |
          python3 scripts/run_media_activation_direct_repair.py \
            --account-id "$ACCOUNT_ID" \
            --source-post-id "$SOURCE_POST_ID" \
            --source-post-media-id "$SOURCE_POST_MEDIA_ID" \
            --expected-manifest-hash "$EXPECTED_MANIFEST_HASH" \
            --use-sheets \
            --dry-run \
            --output /tmp/media-activation-direct-repair-plan.json

      - name: Check free-tier preparation budget
        if: github.event.inputs.confirm_repair == 'true'
        run: |
          python3 scripts/check_media_resource_budget.py \
            --use-sheets \
            --check-cloudinary \
            --apply \
            --confirm-resource-usage \
            --enforce \
            --purpose prepare

      - name: Apply exact Direct media repair
        if: github.event.inputs.confirm_repair == 'true'
        env:
          ALLOW_VIDEO_DOWNLOAD: "true"
          ALLOW_CLOUDINARY_UPLOAD: "true"
          ALLOW_LOCAL_TRANSCRIPTION: "true"
        run: |
          python3 scripts/run_media_activation_direct_repair.py \
            --account-id "$ACCOUNT_ID" \
            --source-post-id "$SOURCE_POST_ID" \
            --source-post-media-id "$SOURCE_POST_MEDIA_ID" \
            --expected-manifest-hash "$EXPECTED_MANIFEST_HASH" \
            --use-sheets \
            --apply \
            --confirm-repair \
            --output /tmp/media-activation-direct-repair-result.json

      - name: Verify posting remained disabled
        if: always()
        run: |
          test "$PUBLISH_ENABLED" = "false"
          test "$ALLOW_REAL_X_POST" = "false"
          test "$ALLOW_REAL_THREADS_POST" = "false"
          test "$ALLOW_MEDIA_POSTS" = "false"
          test "$ALLOW_REAL_THREADS_VIDEO_POST" = "false"
          test "$ALLOW_VIDEO_CUT" = "false"
          test "$ALLOW_TRANSCRIPTION_API" = "false"
          test "$GITHUB_MODELS_ENABLED" = "false"
          echo "PASS: no posting, cutting or external-model gate was enabled"

      - name: Clean transient media workspace
        if: always()
        run: python3 scripts/cleanup_media_workspace.py --apply --confirm-cleanup
