name: Production Readiness Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-growth-production-readiness-acceptance
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Evaluate current production inventory and delivery evidence
        id: acceptance
        continue-on-error: true
        run: |
          mkdir -p /tmp/production-readiness-acceptance
          python3 scripts/run_production_readiness_acceptance.py \
            --output /tmp/production-readiness-acceptance/readiness.json
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-readiness-acceptance-${{ github.run_id }}
          path: /tmp/production-readiness-acceptance/readiness.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve readiness failure
        if: always() && steps.acceptance.outcome != 'success'
        run: |
          echo "[BLOCKED] production readiness acceptance reported unresolved blockers"
          exit 1
