name: Direct Reference Media Night Scout

on:
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      confirm_direct_media:
        description: "Type true to dispatch the prepared direct-media slot"
        required: true
        default: "false"
      dry_run_only:
        required: false
        default: "false"
      queue_id:
        description: "Exact human-approved READY queue ID (required for manual publish)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: sns-growth-production-night-scout-${{ github.ref }}
  cancel-in-progress: false

env:
  ACCOUNT_ID: "night_scout"
  CONTENT_SLOT_ID: "ns_1800_direct_media"
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  dispatch-prepared-direct-media:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify triggering revision
        run: |
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Schedule heartbeat
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "event=${{ github.event_name }}"
          echo "account=$ACCOUNT_ID"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Early runtime preflight
        id: preflight
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm_direct_media }}
          MANUAL_QUEUE_ID: ${{ github.event.inputs.queue_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from scheduled_execution_guard import append_job_summary, missing_required_secrets, scheduled_window_decision
          should_publish = os.environ.get("GITHUB_EVENT_NAME") == "schedule" or os.environ.get("MANUAL_CONFIRM") == "true"
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and os.environ.get("MANUAL_CONFIRM") == "true" and not os.environ.get("MANUAL_QUEUE_ID", "").strip():
              raise SystemExit("[BLOCKED] manual publish requires exact queue_id")
          missing = missing_required_secrets(("GEMINI_API_KEY",)) if should_publish else []
          window = scheduled_window_decision(os.environ["CONTENT_SLOT_ID"])
          payload = {"missing_secret_names": missing, "window": window}
          append_job_summary("Scheduled direct-media preflight", payload)
          print(json.dumps(payload, ensure_ascii=False))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"window_allowed={'true' if window.get('status') == 'PASS' else 'false'}\n")
          if missing:
              raise SystemExit("[BLOCKED] required production secret is unavailable: " + ",".join(missing))
          PY

      - name: Install dispatcher dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Normalize exact direct-media caption
        if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_direct_media == 'true' && github.event.inputs.dry_run_only != 'true')
        run: python3 scripts/normalize_scheduled_media_caption.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --apply --use-sheets
      - name: Dry-run prepared inventory
        run: python3 scripts/run_direct_reference_media_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --queue-id "${{ github.event.inputs.queue_id }}" --post-ready --dry-run --use-sheets --json-output /tmp/direct-preflight.json
      - name: Stop delayed scheduled execution with prepared inventory preserved
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed != 'true'
        run: |
          echo '{"status":"NO_POST","reason":"scheduled_run_out_of_window","prepared_inventory_preserved":true}' | tee -a "$GITHUB_STEP_SUMMARY"
          exit 2
      - name: Hybrid review and exact media promotion
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_direct_media == 'true' && github.event.inputs.dry_run_only != 'true'
        run: python3 scripts/run_hybrid_ready_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --queue-id "${{ github.event.inputs.queue_id }}" --max-candidates 1 --approval-mode media --apply --use-sheets --json-output /tmp/hybrid-ready.json
      - name: Select exact autonomous READY candidate
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('/tmp/direct-preflight.json').read_text())
          queue_id = str(source.get('selected_queue_id', ''))
          if source.get('status') != 'DRY_RUN' or not queue_id:
              raise SystemExit('[NO_POST] no exact autonomous READY direct-media candidate')
          Path('/tmp/hybrid-ready.json').write_text(json.dumps({
              'status': 'READY',
              'selected_queue_id': queue_id,
              'selection_source': 'publisher_preflight_read_after_write',
          }) + '\n')
          PY
      - name: Resolve scheduled activation gate
        id: activation
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true'
        run: |
          set +e
          python3 scripts/scheduled_publish_activation_gate.py --use-sheets | tee /tmp/activation-gate.json
          rc=${PIPESTATUS[0]}
          {
            echo "### Runtime activation gate"
            echo '```json'
            cat /tmp/activation-gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
      - name: Check free-tier post budget
        id: media_budget
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_direct_media == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.activation.outputs.allowed == 'true')
        run: python3 scripts/check_media_resource_budget.py --use-sheets --apply --confirm-resource-usage --enforce --purpose post
      - name: Guard publisher, credentials, and kill switch
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_direct_media == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.activation.outputs.allowed == 'true')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path("config/autonomous_mode.json").read_text()).get("kill_switch"):
              raise SystemExit("[BLOCKED] kill_switch=true")
          PY
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 THREADS_ACCESS_TOKEN_NIGHT_SCOUT THREADS_USER_ID_NIGHT_SCOUT GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Dispatch one READY direct-media item
        if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_direct_media == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.activation.outputs.allowed == 'true')) && steps.media_budget.outcome == 'success'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_THREADS_CAROUSEL: "true"
          ALLOW_THREADS_MIXED_CAROUSEL: "false"
          ALLOW_REAL_X_POST: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
        run: |
          qid=$(python3 -c "import json; print(json.load(open('/tmp/hybrid-ready.json')).get('selected_queue_id',''))")
          if [ -z "$qid" ]; then echo "[NO_POST] no AI-approved direct-media candidate"; exit 2; fi
          python3 scripts/run_direct_reference_media_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --queue-id "$qid" --post-ready --apply --confirm-direct-media --use-sheets
      - name: Health summary
        if: always()
        continue-on-error: true
        run: python3 scripts/check_autonomous_health.py --account-id "$ACCOUNT_ID" --dry-run --use-sheets
