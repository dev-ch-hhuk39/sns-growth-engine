name: Reference Post Read-Only Rehearsal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout triggering main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install read-only rehearsal dependencies
        run: python3 -m pip install --requirement requirements-acquisition.txt

      - name: Verify required secrets exist without printing values
        run: |
          set -euo pipefail
          test -n "$SNS_MASTER_SHEET_ID$SPREADSHEET_ID"
          test -n "$SA_JSON_BASE64$GCP_SA_JSON_BASE64"
          test -n "$GEMINI_API_KEY"
          echo "required_secret_presence=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate reference-only previews from current raw reference posts
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import math
          import os
          import re
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          sys.path[:0] = [str(ROOT), str(ROOT / 'src'), str(ROOT / 'scripts')]

          import gspread
          from config_loader import get_config
          from gemini_hybrid_client import GeminiHybridClient
          from hybrid_ai_gate import HybridAiGate
          from sheets_client import SheetsClient
          from sheets_record_reader import enable_readonly_record_cache, read_records_safely
          from generate_threads_ideas_from_references import build_generation_rows

          JST = timezone(timedelta(hours=9))
          OUT = Path('/tmp/reference-post-readonly-rehearsal')
          OUT.mkdir(parents=True, exist_ok=True)

          REAL_FLAGS = (
              'PUBLISH_ENABLED', 'ALLOW_REAL_THREADS_POST', 'ALLOW_REAL_X_POST',
              'ALLOW_MEDIA_POSTS', 'ALLOW_REAL_THREADS_VIDEO_POST',
              'ALLOW_VIDEO_DOWNLOAD', 'ALLOW_VIDEO_CUT', 'ALLOW_CLOUDINARY_UPLOAD',
              'ALLOW_TRANSCRIPTION_API',
          )
          enabled = [name for name in REAL_FLAGS if str(os.environ.get(name, '')).strip().lower() in {'1','true','yes','on','enabled'}]
          if enabled:
              raise SystemExit('unsafe real action flags enabled: ' + ','.join(enabled))

          cfg = get_config()
          client = SheetsClient(sheet_id=cfg['sheet_id'], sa_dict=cfg['sa_dict'], dry_run=True)
          enable_readonly_record_cache(client)

          def records(logical):
              try:
                  return read_records_safely(client, logical)
              except Exception:
                  return []

          def fingerprint(rows):
              payload = json.dumps(rows, ensure_ascii=False, sort_keys=True, default=str, separators=(',', ':'))
              return hashlib.sha256(payload.encode('utf-8')).hexdigest()

          queue_before = records('queue')
          queue_before_fp = fingerprint(queue_before)

          b64 = (os.environ.get('GCP_SA_JSON_BASE64') or os.environ.get('SA_JSON_BASE64') or '').strip()
          sheet_id = (os.environ.get('SPREADSHEET_ID') or os.environ.get('SNS_MASTER_SHEET_ID') or '').strip()
          sa = json.loads(base64.b64decode(b64).decode('utf-8'))
          gc = gspread.service_account_from_dict(sa)
          book = gc.open_by_key(sheet_id)
          raw_rows = book.worksheet('参照元投稿').get_all_records()

          def to_int(value):
              try:
                  return int(float(str(value).strip()))
              except Exception:
                  return 0

          def engagement(row):
              value = row.get('engagement_json')
              if isinstance(value, dict):
                  return value
              if isinstance(value, str) and value.strip():
                  try:
                      parsed = json.loads(value)
                      return parsed if isinstance(parsed, dict) else {}
                  except Exception:
                      return {}
              return {}

          def published_key(row):
              raw = str(row.get('published_at') or row.get('discovered_at') or '').strip()
              if raw.isdigit():
                  return to_int(raw)
              return 0

          def clean_text(row):
              return str(row.get('original_post_text') or '').replace('\\n', '\n').strip()

          def eligible(row, account):
              if str(row.get('target_account_id') or '').strip() != account:
                  return False
              text = clean_text(row)
              if len(re.sub(r'\s+', '', text)) < 20:
                  return False
              low = text.lower()
              if 'join threads to share ideas' in low or 'log in with your instagram' in low:
                  return False
              if str(row.get('source_account_id') or '').strip() == 'system_generated':
                  return False
              if str(row.get('platform') or '').strip() == 'system_generated_owned':
                  return False
              return True

          def diagnostic_score(row):
              eng = engagement(row)
              views = to_int(eng.get('view_count') or eng.get('views'))
              likes = to_int(eng.get('like_count') or eng.get('likes'))
              comments = to_int(eng.get('comment_count') or eng.get('comments'))
              reposts = to_int(eng.get('repost_count') or eng.get('reposts'))
              # Diagnostic ranking only. This does not replace production reference scoring.
              score = math.log1p(max(0, views)) * 100 + math.log1p(max(0, likes)) * 35 + math.log1p(max(0, comments)) * 50 + math.log1p(max(0, reposts)) * 45
              return round(score, 6), {'views': views, 'likes': likes, 'comments': comments, 'reposts': reposts}

          posted = records('posted_results')
          history_by_account = {}
          for account in ('night_scout', 'liver_manager'):
              hist = []
              for row in posted:
                  if str(row.get('account_id') or row.get('target_account_id') or '') != account:
                      continue
                  text = str(row.get('public_post_text') or row.get('post_text') or row.get('text') or '').strip()
                  if text:
                      hist.append(text)
              history_by_account[account] = hist[-30:]

          report = {
              'schema_version': 'reference_post_readonly_rehearsal_v1',
              'generated_at_jst': datetime.now(JST).isoformat(),
              'would_post': False,
              'writes_performed': False,
              'selection_note': 'Diagnostic only: current raw 参照元投稿 rows are ranked by read-only engagement-derived score, then passed through the existing production reference writer and Gemini gate. This does not modify production scoring.',
              'accounts': [],
          }

          for account, slot_id in (('night_scout', 'ns_1400_reference'), ('liver_manager', 'lm_1300_reference')):
              candidates = []
              for row in raw_rows:
                  if not eligible(row, account):
                      continue
                  score, metrics = diagnostic_score(row)
                  candidates.append((score, published_key(row), str(row.get('source_post_id') or ''), row, metrics))
              candidates.sort(key=lambda item: (item[0], item[1], item[2]), reverse=True)
              selected = candidates[:20]

              posts = []
              scores = []
              raw_by_post_id = {}
              for rank, (score, _pub, post_id, row, metrics) in enumerate(selected, 1):
                  if not post_id:
                      continue
                  post = {
                      'post_id': post_id,
                      'source_id': str(row.get('source_id') or row.get('source_account_id') or ''),
                      'post_text': clean_text(row),
                      'post_url': str(row.get('canonical_post_url') or ''),
                      'title': '',
                      'category': str(row.get('platform') or ''),
                  }
                  posts.append(post)
                  scores.append({
                      'account_id': account,
                      'reference_post_id': post_id,
                      'total_score': score,
                      'cta_score': metrics['comments'],
                      'reusable_pattern': '',
                      'reason': 'read-only raw-reference diagnostic ranking',
                  })
                  raw_by_post_id[post_id] = {'row': row, 'metrics': metrics, 'diagnostic_score': score, 'rank': rank}

              built = build_generation_rows(
                  account_id=account,
                  posts=posts,
                  scores=scores,
                  top_n=len(posts),
                  slot_id=slot_id,
                  post_type='reference_text',
                  theme='',
                  schedule_date_jst=datetime.now(JST).strftime('%Y-%m-%d'),
                  history=history_by_account.get(account, []),
              )
              queues = list(built.get('queue') or [])

              reservations = []
              def reserve(meta):
                  if len(reservations) >= 20:
                      raise RuntimeError('readonly_account_request_limit_exceeded')
                  reservations.append(dict(meta))
              gate = HybridAiGate(GeminiHybridClient(reserve_request=reserve))

              account_dir = OUT / account
              account_dir.mkdir(parents=True, exist_ok=True)
              previews = []
              for idx, q in enumerate(queues[:5], 1):
                  source_url = str(q.get('source_url') or '')
                  source_id = str(q.get('source_id') or '')
                  source_post = next((p for p in posts if str(p.get('source_id') or '') == source_id and str(p.get('post_url') or '') == source_url), None)
                  if source_post is None:
                      source_post = next((p for p in posts if str(p.get('source_id') or '') == source_id), None)
                  source_post = source_post or {}
                  source_post_id = str(source_post.get('post_id') or '')
                  raw_info = raw_by_post_id.get(source_post_id, {})
                  row = raw_info.get('row') or {}
                  context = {
                      'source_text': str(source_post.get('post_text') or ''),
                      'original_post_text': str(source_post.get('post_text') or ''),
                      'source_url': source_url,
                      'source_platform': str(row.get('platform') or ''),
                      'rights_status': str(row.get('rights_status') or ''),
                      'permission_status': str(row.get('permission_status') or ''),
                  }
                  candidate = dict(q)
                  candidate.update({
                      'account_id': account,
                      'target_account_id': account,
                      'platform': 'threads',
                      'slot_id': slot_id,
                      'content_type': 'reference_text',
                  })
                  try:
                      review = gate.evaluate(candidate, context)
                      gemini_status = review.status
                      gemini_route = review.route
                      blocked_reasons = list(review.blocked_reasons or [])
                      final_text = str(review.public_post_text or candidate.get('public_post_text') or '').strip()
                  except Exception as exc:
                      gemini_status = 'RUNTIME_ERROR'
                      gemini_route = ''
                      blocked_reasons = [f'{type(exc).__name__}:gemini_reference_rehearsal_failed']
                      final_text = str(candidate.get('public_post_text') or '').strip()

                  item = {
                      'candidate_index': idx,
                      'account_id': account,
                      'slot_id': slot_id,
                      'source_post_id': source_post_id,
                      'source_id': source_id,
                      'source_platform': str(row.get('platform') or ''),
                      'source_url': source_url,
                      'source_text': str(source_post.get('post_text') or ''),
                      'source_metrics': raw_info.get('metrics') or {},
                      'diagnostic_source_score': raw_info.get('diagnostic_score'),
                      'generated_before_gemini': str(candidate.get('public_post_text') or ''),
                      'gemini_status': gemini_status,
                      'gemini_route': gemini_route,
                      'blocked_reasons': blocked_reasons,
                      'final_text': final_text,
                  }
                  previews.append(item)
                  cdir = account_dir / f'candidate_{idx:02d}'
                  cdir.mkdir(parents=True, exist_ok=True)
                  (cdir / 'source.txt').write_text(item['source_text'] + '\n', encoding='utf-8')
                  (cdir / 'generated_before_gemini.txt').write_text(item['generated_before_gemini'] + '\n', encoding='utf-8')
                  (cdir / 'final_text.txt').write_text(item['final_text'] + '\n', encoding='utf-8')
                  (cdir / 'details.json').write_text(json.dumps(item, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

              account_report = {
                  'account_id': account,
                  'slot_id': slot_id,
                  'raw_eligible_count': len(candidates),
                  'diagnostic_selected_count': len(posts),
                  'production_writer_candidate_count': len(queues),
                  'gemini_request_count': len(reservations),
                  'previews': previews,
              }
              report['accounts'].append(account_report)

          queue_after = records('queue')
          report['queue_unchanged'] = queue_before_fp == fingerprint(queue_after)
          if not report['queue_unchanged']:
              raise SystemExit('safety failure: queue changed during read-only rehearsal')

          (OUT / 'reference_preview.json').write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          lines = [
              '# Reference Post Read-Only Rehearsal', '',
              f"generated_at_jst: {report['generated_at_jst']}",
              'would_post: false',
              'writes_performed: false',
              f"queue_unchanged: {report['queue_unchanged']}",
              '',
              'NOTE: source ranking in this rehearsal is diagnostic only. Production reference scoring is not modified.',
              '',
          ]
          for acct in report['accounts']:
              lines += [
                  f"## {acct['account_id']} / {acct['slot_id']}",
                  f"- raw_eligible_count: {acct['raw_eligible_count']}",
                  f"- diagnostic_selected_count: {acct['diagnostic_selected_count']}",
                  f"- production_writer_candidate_count: {acct['production_writer_candidate_count']}",
                  f"- gemini_request_count: {acct['gemini_request_count']}",
                  '',
              ]
              for item in acct['previews']:
                  lines += [
                      f"### candidate {item['candidate_index']}",
                      f"source_platform: {item['source_platform']}",
                      f"source_url: {item['source_url']}",
                      f"source_metrics: {json.dumps(item['source_metrics'], ensure_ascii=False)}",
                      f"gemini_status: {item['gemini_status']}",
                      f"blocked_reasons: {', '.join(item['blocked_reasons']) if item['blocked_reasons'] else 'none'}",
                      '',
                      'SOURCE:', item['source_text'], '',
                      'GENERATED BEFORE GEMINI:', item['generated_before_gemini'], '',
                      'FINAL TEXT:', item['final_text'], '',
                  ]
          (OUT / 'SUMMARY.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps({
              'status': 'PASS',
              'artifact_root': str(OUT),
              'would_post': False,
              'writes_performed': False,
              'queue_unchanged': report['queue_unchanged'],
              'accounts': [
                  {
                      'account_id': a['account_id'],
                      'raw_eligible_count': a['raw_eligible_count'],
                      'production_writer_candidate_count': a['production_writer_candidate_count'],
                      'preview_count': len(a['previews']),
                      'gemini_request_count': a['gemini_request_count'],
                  }
                  for a in report['accounts']
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload reference rehearsal bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-post-readonly-rehearsal
          path: /tmp/reference-post-readonly-rehearsal
          if-no-files-found: error
          retention-days: 7
