name: Publication Review Board

on:
  schedule:
    # Every two hours: mirror fresh candidates and apply only explicit OK/NG/HOLD decisions.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Sync previews only, or also apply explicit review decisions
        type: choice
        required: true
        default: sync-and-apply
        options: [sync-only, sync-and-apply]

permissions:
  contents: read

concurrency:
  group: publication-review-board
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      MODE: ${{ inputs.mode || 'sync-and-apply' }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Sheets dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Guard Sheets credentials without exposing values
        run: |
          if [ -z "$SNS_MASTER_SHEET_ID" ] && [ -z "$SPREADSHEET_ID" ]; then
            echo "BLOCKED: spreadsheet secret missing"
            exit 1
          fi
          if [ -z "$SA_JSON_BASE64" ] && [ -z "$GCP_SA_JSON_BASE64" ]; then
            echo "BLOCKED: Sheets service account secret missing"
            exit 1
          fi
      - name: Sync publication review previews
        run: |
          mkdir -p /tmp/publication-review
          python3 scripts/sync_publication_review.py \
            --apply --confirm-review-sync --use-sheets \
            --output /tmp/publication-review/sync.json
      - name: Apply explicit review decisions without posting
        if: env.MODE == 'sync-and-apply'
        run: |
          python3 scripts/apply_publication_review_decisions.py \
            --apply --confirm-review-decisions --use-sheets \
            --output /tmp/publication-review/decisions.json
      - name: Upload review summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-review-${{ github.run_id }}
          path: /tmp/publication-review/*.json
          if-no-files-found: warn
          retention-days: 14
