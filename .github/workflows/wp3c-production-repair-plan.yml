name: CI WP3-C Production Repair Plan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-growth-wp3c-repair-plan
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  repair_plan:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Generate Repair Plan
        run: |
          python3 scripts/plan_wp3c_production_repairs.py --output /tmp/wp3c_repair_plan.json > stdout.log
          cat stdout.log
          
          if grep -q 'WP3C_SAFE_REPAIR_PLAN_JSON=' stdout.log; then
             PLAN_JSON=$(grep 'WP3C_SAFE_REPAIR_PLAN_JSON=' stdout.log | sed 's/WP3C_SAFE_REPAIR_PLAN_JSON=//')
             
             echo "## WP3-C Safe Repair Plan Summary" >> $GITHUB_STEP_SUMMARY
             
             echo "### Overall Status" >> $GITHUB_STEP_SUMMARY
             echo "\`$(echo "$PLAN_JSON" | jq -r '.overall_status')\`" >> $GITHUB_STEP_SUMMARY
             
             echo "### Parent Repairs" >> $GITHUB_STEP_SUMMARY
             echo "$PLAN_JSON" | jq -r '.parent_repairs[] | "- **Source Post ID**: `\(.source_post_id)`\n  - Declared: \(.declared_media_count)\n  - Actual: \(.actual_child_count)\n  - Canonical mismatch children: \(.canonical_mismatch_child_ids | join(", "))\n  - Duplicate index groups: \(.unique_media_index_count)\n  - Operations: \(.operations | length)\n  - Apply Eligible: \(.apply_eligible)\n  - Blockers: \(.blocker_codes | join(", "))"' >> $GITHUB_STEP_SUMMARY
             
             echo "### Stale Slots" >> $GITHUB_STEP_SUMMARY
             echo "$PLAN_JSON" | jq -r '.stale_slot_reviews[] | "- **Slot ID**: `\(.slot_run_id)`\n  - Recommendation: \(.recommendation)"' >> $GITHUB_STEP_SUMMARY
             
             echo "### External Blockers" >> $GITHUB_STEP_SUMMARY
             echo "$PLAN_JSON" | jq -r '.external_blockers[] | "- `\(.code)`: \(.resolution)"' >> $GITHUB_STEP_SUMMARY
          fi
