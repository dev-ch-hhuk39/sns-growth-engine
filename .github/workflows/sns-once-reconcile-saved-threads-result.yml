name: One-Shot Authenticated Saved Threads Queue Reconciliation

# Single historical queue only. Triggered on first introduction to main.
# Re-runs, later file edits, and non-main events cannot apply a repair.
# No SNS publish, posted_results append, or replay of a failed post.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sns-once-reconcile-saved-threads-result.yml

permissions:
  contents: read

concurrency:
  group: sns-growth-production-liver-manager-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  verified-saved-result-queue-only:
    if: github.repository == 'dev-ch-hhuk39/sns-growth-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      ACCOUNT_ID: liver_manager
      EXPECTED_QUEUE_ID: q_liver_manager_fallback_20260915140951_1_threads
      TARGET_WORKFLOW: .github/workflows/sns-once-reconcile-saved-threads-result.yml
      BEFORE_SHA: ${{ github.event.before }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Prove one-shot main introduction and immutable target
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dev-ch-hhuk39/sns-growth-engine"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            echo "[BLOCKED] one-shot workflow must not be rerun"
            exit 2
          }
          [[ "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
          test "$BEFORE_SHA" != "0000000000000000000000000000000000000000"
          git cat-file -e "$BEFORE_SHA^{commit}" || {
            echo "[BLOCKED] original main commit is unavailable"
            exit 2
          }
          if git cat-file -e "$BEFORE_SHA:$TARGET_WORKFLOW" 2>/dev/null; then
            echo "[BLOCKED] workflow existed before this push; not a one-shot introduction"
            exit 2
          fi
          git cat-file -e "$GITHUB_SHA:$TARGET_WORKFLOW" || exit 2
          test -n "${SPREADSHEET_ID:-}${SNS_MASTER_SHEET_ID:-}" || exit 2
          test -n "${GCP_SA_JSON_BASE64:-}${SA_JSON_BASE64:-}" || exit 2
          test -n "${THREADS_ACCESS_TOKEN_LIVER_MANAGER:-}" || exit 2
          test -n "${THREADS_USER_ID_LIVER_MANAGER:-}" || exit 2
          echo "one_shot_guard=PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned runtime dependencies
        run: python3 -m pip install --requirement requirements.txt
      - name: Read-only authenticated provider match
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/recover_orphan_threads_post.py \
              --account-id "$ACCOUNT_ID" \
              --queue-id "$EXPECTED_QUEUE_ID" \
              --reconcile-saved-result-queue > "$RUNNER_TEMP/reconcile-verify.json" 2> "$RUNNER_TEMP/reconcile-verify.err"; then
            echo "[BLOCKED] saved result or authenticated provider GET not verified"
            exit 2
          fi
          grep -Fq '"status": "PLAN_ONLY"' "$RUNNER_TEMP/reconcile-verify.json" || {
            echo "[BLOCKED] exact stored/provider match not proven"
            exit 2
          }
          echo "provider_get_and_saved_result=VERIFIED_READ_ONLY" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply one queue-only repair with read-after-write
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 scripts/recover_orphan_threads_post.py \
              --account-id "$ACCOUNT_ID" \
              --queue-id "$EXPECTED_QUEUE_ID" \
              --reconcile-saved-result-queue --apply > "$RUNNER_TEMP/reconcile-apply.json" 2> "$RUNNER_TEMP/reconcile-apply.err"; then
            echo "[BLOCKED] queue-only mutation not confirmed; no automatic retry"
            exit 2
          fi
          grep -Fq '"status": "RECONCILED_QUEUE_ONLY"' "$RUNNER_TEMP/reconcile-apply.json" || {
            echo "[BLOCKED] queue read-after-write not verified; no automatic retry"
            exit 2
          }
          echo "one_saved_result_queue=READ_AFTER_WRITE_VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "sns_publish_attempts=0" >> "$GITHUB_STEP_SUMMARY"
