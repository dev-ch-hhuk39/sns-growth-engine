name: Production Disk Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-growth-production-disk-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Read-only filesystem capacity audit
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DISK_AUDIT_BEGIN ==="
          date --iso-8601=seconds
          echo "--- df root ---"
          df -B1 /
          echo "--- root top-level usage ---"
          du -x -B1 --max-depth=1 / 2>/dev/null | sort -nr | head -n 40 || true
          echo "--- top-level scoped usage ---"
          for path in /opt /var /usr /root /srv /tmp /home; do
            if [ -e "$path" ]; then
              echo "PATH=$path"
              du -x -B1 --max-depth=1 "$path" 2>/dev/null | sort -nr | head -n 30 || true
            fi
          done
          echo "--- detailed large service usage ---"
          for path in /srv/live-hyakka /opt/chadult-renewal-hp /var/lib; do
            if [ -e "$path" ]; then
              echo "PATH=$path"
              du -x -B1 --max-depth=2 "$path" 2>/dev/null | sort -nr | head -n 100 || true
            fi
          done
          echo "--- large files in scoped heavy paths (>200 MiB) ---"
          for path in /srv/live-hyakka /opt/chadult-renewal-hp /var/lib; do
            if [ -e "$path" ]; then
              find "$path" -xdev -type f -size +200M \
                -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -nr | head -n 80 || true
            fi
          done
          echo "--- deleted but open files ---"
          if command -v lsof >/dev/null 2>&1; then
            lsof -nP +L1 2>/dev/null | head -n 120 || true
          else
            echo LSOF_UNAVAILABLE
          fi
          echo "--- sns-growth runner usage ---"
          for path in \
            /opt/github-runners/sns-growth-engine \
            /opt/github-runners/sns-growth-engine/_work \
            /opt/github-runners/sns-growth-engine/_tool \
            /opt/github-runners/sns-growth-engine/.buffered-runtime; do
            if [ -e "$path" ]; then
              echo "PATH=$path"
              du -x -B1 --max-depth=2 "$path" 2>/dev/null | sort -nr | head -n 60 || true
            fi
          done
          echo "--- large files under sns-growth runner (>200 MiB) ---"
          find /opt/github-runners/sns-growth-engine -xdev -type f -size +200M \
            -printf '%s\t%TY-%Tm-%TdT%TH:%TM:%TS\t%p\n' 2>/dev/null | sort -nr | head -n 50 || true
          echo "--- buffered runtime release pointers ---"
          runtime=/opt/github-runners/sns-growth-engine/.buffered-runtime
          if [ -d "$runtime" ]; then
            printf 'CURRENT='; readlink -f "$runtime/current" 2>/dev/null || true
            find "$runtime/releases" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@\t%p\n' 2>/dev/null | sort -nr | head -n 30 || true
          fi
          echo "--- elevated visibility availability ---"
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            echo "ROOT_READONLY_AUDIT=AVAILABLE"
            echo "--- elevated top-level filesystem usage ---"
            sudo -n du -x -B1 --max-depth=1 / 2>/dev/null | sort -nr | head -n 40 || true
            echo "--- elevated private and package cache usage ---"
            for path in /root /root/.cache /root/.local /root/.npm /root/.cargo /var/cache /var/log /tmp; do
              if sudo -n test -e "$path"; then
                printf 'PATH=%s BYTES=' "$path"
                sudo -n du -sx -B1 "$path" 2>/dev/null | awk '{print $1}' || true
              fi
            done
            echo "--- elevated deleted open regular files total (non-memfd) ---"
            if command -v lsof >/dev/null 2>&1; then
              sudo -n lsof -nP +L1 2>/dev/null | awk '$5=="REG" && $6!="0,1" && $7~/^[0-9]+$/ {n++;sum+=$7} END {printf "FD_COUNT=%d NON_MEMFD_SIZE_SUM_BYTES=%.0f\n",n,sum}' || true
            fi
          else
            echo "ROOT_READONLY_AUDIT=UNAVAILABLE"
          fi
          echo "=== DISK_AUDIT_END ==="
