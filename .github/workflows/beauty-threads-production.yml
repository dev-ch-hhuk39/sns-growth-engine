name: Beauty Threads Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "prepare creates WAITING_REVIEW; publish/publish_media processes one human-approved READY row"
        required: true
        default: dry_run
        type: choice
        options: [dry_run, prepare, publish, publish_media]
      slot_index:
        description: "0 = 11:30 JST, 1 = 20:30 JST"
        required: true
        default: "0"
        type: choice
        options: ["0", "1"]
      confirm_publish:
        description: "Must be true for manual publish"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      media_route:
        description: "Exact media lane used only by publish_media"
        required: false
        default: direct_reference_media
        type: choice
        options: [direct_reference_media, approved_source_clip]
      queue_id:
        description: "Exact human-approved READY queue ID required by publish_media"
        required: false
        default: ""
  schedule:
    # Candidate preparation: 09:30 / 18:30 JST
    - cron: "30 0 * * *"
    - cron: "30 9 * * *"
    # One approved READY publication opportunity: 11:30 / 20:30 JST.
    # Human-approved media may occupy the slot; otherwise today's approved
    # text candidate is used. This preserves the two-post/day Beauty ceiling.
    - cron: "30 2 * * *"
    - cron: "30 11 * * *"

concurrency:
  group: beauty-threads-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  MOCK_LLM: "false"
  MOCK_SHEETS: "false"

jobs:
  beauty-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.BEAUTY_GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
      THREADS_HANDLE_BEAUTY_ACCOUNT: ${{ secrets.THREADS_HANDLE_BEAUTY_ACCOUNT }}
      THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT: ${{ secrets.THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT }}
      THREADS_USER_ID_BEAUTY_ACCOUNT: ${{ secrets.THREADS_USER_ID_BEAUTY_ACCOUNT }}
      BEAUTY_ACTIVATION_APPROVED: ${{ secrets.BEAUTY_ACTIVATION_APPROVED }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve scheduled action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> "$GITHUB_ENV"
            echo "SLOT_INDEX=${{ github.event.inputs.slot_index }}" >> "$GITHUB_ENV"
          else
            case "${{ github.event.schedule }}" in
              "30 0 * * *") echo "ACTION=prepare" >> "$GITHUB_ENV"; echo "SLOT_INDEX=0" >> "$GITHUB_ENV" ;;
              "30 9 * * *") echo "ACTION=prepare" >> "$GITHUB_ENV"; echo "SLOT_INDEX=1" >> "$GITHUB_ENV" ;;
              "30 2 * * *") echo "ACTION=publish" >> "$GITHUB_ENV"; echo "SLOT_INDEX=0" >> "$GITHUB_ENV" ;;
              "30 11 * * *") echo "ACTION=publish" >> "$GITHUB_ENV"; echo "SLOT_INDEX=1" >> "$GITHUB_ENV" ;;
              *) echo "ACTION=dry_run" >> "$GITHUB_ENV"; echo "SLOT_INDEX=0" >> "$GITHUB_ENV" ;;
            esac
          fi
          echo "BUSINESS_DATE_JST=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
          if [ "$SLOT_INDEX" = "0" ]; then
            echo "BEAUTY_SLOT_ID=beauty_1130" >> "$GITHUB_ENV"
          else
            echo "BEAUTY_SLOT_ID=beauty_2030" >> "$GITHUB_ENV"
          fi
          if [ "$ACTION" = "publish_media" ]; then
            if [ "${{ github.event.inputs.media_route }}" = "approved_source_clip" ]; then
              echo "BEAUTY_SLOT_ID=beauty_clip_review" >> "$GITHUB_ENV"
            else
              echo "BEAUTY_SLOT_ID=beauty_direct_media_review" >> "$GITHUB_ENV"
            fi
          fi

      - name: Guard required secrets
        run: |
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "[BLOCKED] required secret is missing: $name"
              exit 1
            fi
          done
          if { [ "$ACTION" = "publish" ] || [ "$ACTION" = "publish_media" ]; } && [ "$BEAUTY_ACTIVATION_APPROVED" = "true" ]; then
            for name in THREADS_HANDLE_BEAUTY_ACCOUNT THREADS_ACCESS_TOKEN_BEAUTY_ACCOUNT THREADS_USER_ID_BEAUTY_ACCOUNT; do
              if [ -z "${!name}" ]; then
                echo "[BLOCKED] Beauty Threads credential is missing: $name"
                exit 1
              fi
            done
          fi
          if [ "$ACTION" = "publish_media" ] && [ -z "${{ github.event.inputs.queue_id }}" ]; then
            echo "[BLOCKED] publish_media requires exact queue_id"
            exit 1
          fi

      - name: Repository-wide Sheets diagnostic
        if: env.ACTION == 'dry_run' || env.ACTION == 'prepare'
        continue-on-error: true
        run: python3 scripts/recover_production_sheets_threads_first.py --verify-only

      - name: Preview candidate
        if: env.ACTION == 'dry_run'
        env:
          DRY_RUN: "false"
        run: python3 scripts/prepare_beauty_review_candidates.py --slot-index "$SLOT_INDEX" --dry-run

      - name: Save WAITING_REVIEW candidate
        if: env.ACTION == 'prepare'
        env:
          DRY_RUN: "false"
        run: python3 scripts/prepare_beauty_review_candidates.py --slot-index "$SLOT_INDEX" --apply --confirm-prepare

      - name: Beauty semantic voice review
        if: env.ACTION == 'prepare'
        env:
          DRY_RUN: "false"
        run: python3 scripts/run_hybrid_ai_queue_gate.py --account-id beauty_account --slot-id "$BEAUTY_SLOT_ID" --max-candidates 1 --apply --use-sheets

      # Scheduled publication keeps the existing two daily windows. It may use
      # a human-approved media READY row; otherwise it uses today's explicitly
      # human-approved text READY row for this slot.
      - name: Select scheduled human-approved Beauty route
        id: scheduled_queue
        if: env.ACTION == 'publish' && github.event_name == 'schedule' && env.BEAUTY_ACTIVATION_APPROVED == 'true'
        run: |
          python3 scripts/select_beauty_scheduled_ready.py \
            --slot-id "$BEAUTY_SLOT_ID" \
            --business-date-jst "$BUSINESS_DATE_JST" \
            --use-sheets \
            --github-output "$GITHUB_OUTPUT"

      - name: Strict scheduled Beauty queue and publisher preflight
        if: env.ACTION == 'publish' && github.event_name == 'schedule' && env.BEAUTY_ACTIVATION_APPROVED == 'true' && steps.scheduled_queue.outputs.queue_id != ''
        run: |
          python3 scripts/process_threads_queue.py \
            --account-id beauty_account \
            --queue-id "${{ steps.scheduled_queue.outputs.queue_id }}" \
            --max-posts 1 \
            --dry-run

      - name: Publish one scheduled human-approved Beauty row
        if: env.ACTION == 'publish' && github.event_name == 'schedule' && env.BEAUTY_ACTIVATION_APPROVED == 'true' && steps.scheduled_queue.outputs.queue_id != ''
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_THREADS_CAROUSEL: "true"
          ALLOW_THREADS_MIXED_CAROUSEL: "false"
          ALLOW_REAL_X_POST: "false"
          BEAUTY_PRODUCTION_ENABLED: "true"
        run: |
          python3 scripts/process_threads_queue.py \
            --account-id beauty_account \
            --queue-id "${{ steps.scheduled_queue.outputs.queue_id }}" \
            --max-posts 1 \
            --confirm-real-post

      - name: Report no scheduled approved Beauty row
        if: env.ACTION == 'publish' && github.event_name == 'schedule' && env.BEAUTY_ACTIVATION_APPROVED == 'true' && steps.scheduled_queue.outputs.queue_id == ''
        run: echo "[NO_POST] no explicit human-approved Beauty READY row for this publication window"

      # Manual text publish preserves the old slot-specific behavior.
      - name: Strict manual Beauty text queue and publisher preflight
        if: env.ACTION == 'publish' && github.event_name == 'workflow_dispatch' && env.BEAUTY_ACTIVATION_APPROVED == 'true'
        run: python3 scripts/process_threads_queue.py --account-id beauty_account --slot-id "$BEAUTY_SLOT_ID" --business-date-jst "$BUSINESS_DATE_JST" --max-posts 1 --dry-run

      - name: Publish one manually confirmed approved READY text row
        if: >-
          env.ACTION == 'publish' &&
          github.event_name == 'workflow_dispatch' &&
          env.BEAUTY_ACTIVATION_APPROVED == 'true' &&
          github.event.inputs.confirm_publish == 'true'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          BEAUTY_PRODUCTION_ENABLED: "true"
        run: python3 scripts/process_threads_queue.py --account-id beauty_account --slot-id "$BEAUTY_SLOT_ID" --business-date-jst "$BUSINESS_DATE_JST" --max-posts 1 --confirm-real-post

      - name: Strict Beauty media queue and publisher preflight
        if: env.ACTION == 'publish_media' && env.BEAUTY_ACTIVATION_APPROVED == 'true'
        run: python3 scripts/process_threads_queue.py --account-id beauty_account --queue-id "${{ github.event.inputs.queue_id }}" --max-posts 1 --dry-run

      - name: Publish one exact human-approved Beauty media row
        if: >-
          env.ACTION == 'publish_media' &&
          env.BEAUTY_ACTIVATION_APPROVED == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.confirm_publish == 'true'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_THREADS_CAROUSEL: "true"
          ALLOW_THREADS_MIXED_CAROUSEL: "false"
          ALLOW_REAL_X_POST: "false"
          BEAUTY_PRODUCTION_ENABLED: "true"
        run: python3 scripts/process_threads_queue.py --account-id beauty_account --queue-id "${{ github.event.inputs.queue_id }}" --max-posts 1 --confirm-real-post

      - name: Block unconfirmed manual publish
        if: (env.ACTION == 'publish' || env.ACTION == 'publish_media') && env.BEAUTY_ACTIVATION_APPROVED == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_publish != 'true'
        run: |
          echo "[BLOCKED] manual publish requires confirm_publish=true"
          exit 1

      - name: Report inactive publish gate
        if: (env.ACTION == 'publish' || env.ACTION == 'publish_media') && env.BEAUTY_ACTIVATION_APPROVED != 'true'
        run: echo "[NO_POST] Beauty activation is not approved; candidate preparation remains available."

      # Candidate preparation performs queue-level read-after-write. The
      # publisher performs posted_results read-after-write and records
      # POSTED_SAVE_UNVERIFIED instead of retrying an ambiguous publish.
