name: Autonomous Growth Loop Liver Manager

on:
  schedule:
    - cron: "45 0 * * *"
    - cron: "45 3 * * *"
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      confirm_autonomous:
        description: "Type true to run liver_manager autonomous Threads loop"
        required: true
        default: "false"
      dry_run_only:
        description: "Run dry-run and health summary only; never apply/post"
        required: false
        default: "false"
      slot_id:
        description: "Canonical text slot for a manual proof"
        required: false
        default: "lm_1000_original"

permissions:
  contents: read
  actions: read

concurrency:
  group: sns-growth-production-liver-manager-${{ github.ref }}
  cancel-in-progress: false

env:
  ACCOUNT_ID: "liver_manager"
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_TRANSCRIPTION_API: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"

jobs:
  autonomous-growth-loop-liver-manager:
    name: Liver Manager scheduled Threads autonomous loop
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      THREADS_ACCESS_TOKEN_NIGHT_SCOUT: ${{ secrets.THREADS_ACCESS_TOKEN_NIGHT_SCOUT }}
      THREADS_USER_ID_NIGHT_SCOUT: ${{ secrets.THREADS_USER_ID_NIGHT_SCOUT }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify triggering revision
        run: |
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Schedule heartbeat
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "event=${{ github.event_name }}"
          echo "account=$ACCOUNT_ID"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Resolve canonical content slot
        env:
          MANUAL_SLOT_ID: ${{ github.event.inputs.slot_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_SLOT_ID" ]; then
            slot="$MANUAL_SLOT_ID"
          else
            case "${{ github.event.schedule }}" in
              "45 0 * * *") slot="lm_1000_original" ;;
              "45 3 * * *") slot="lm_1300_reference" ;;
              "45 11 * * *") slot="lm_2100_pdca" ;;
              *) slot="manual_text" ;;
            esac
          fi
          echo "CONTENT_SLOT_ID=$slot" >> "$GITHUB_ENV"
          echo "content_slot=$slot"

      - name: Early runtime preflight
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm_autonomous }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "scripts")
          from scheduled_execution_guard import append_job_summary, missing_required_secrets, scheduled_window_decision
          slot_id = os.environ["CONTENT_SLOT_ID"]
          should_publish = os.environ.get("GITHUB_EVENT_NAME") == "schedule" or os.environ.get("MANUAL_CONFIRM") == "true"
          missing = missing_required_secrets() if should_publish else []
          window = scheduled_window_decision(slot_id)
          append_job_summary("Scheduled runtime preflight", {"missing_secret_names": missing, "window": window})
          print(json.dumps({"missing_secret_names": missing, "window": window}, ensure_ascii=False))
          if missing:
              raise SystemExit("[BLOCKED] required production secret is unavailable: " + ",".join(missing))
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dry-run autonomous plan
        run: python3 scripts/run_autonomous_loop.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --dry-run

      - name: Resolve autonomous execution mode
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm_autonomous }}
          MANUAL_DRY_RUN_ONLY: ${{ github.event.inputs.dry_run_only }}
        run: |
          apply=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            apply=$(python3 - <<'PYMODE'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/autonomous_mode.json").read_text())
          allowed = bool(cfg.get("autonomous_mode_enabled") and cfg.get("production_publish_activation_approved") and cfg.get("scheduled_publish_enabled") and not cfg.get("kill_switch"))
          print("true" if allowed else "false")
          PYMODE
            )
          elif [ "$MANUAL_CONFIRM" = "true" ] && [ "$MANUAL_DRY_RUN_ONLY" != "true" ]; then
            apply=true
          fi
          echo "RUN_AUTONOMOUS_APPLY=$apply" >> "$GITHUB_ENV"
          echo "autonomous_apply=$apply" >> "$GITHUB_STEP_SUMMARY"

      - name: Guard autonomous activation and Sheets credentials
        if: env.RUN_AUTONOMOUS_APPLY == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/autonomous_mode.json").read_text())
          if cfg.get("kill_switch"):
              raise SystemExit("[BLOCKED] autonomous kill_switch=true")
          if not cfg.get("production_publish_activation_approved", False):
              raise SystemExit("[BLOCKED] production_publish_activation_approved=false")
          PY
          test -n "$SNS_MASTER_SHEET_ID$SPREADSHEET_ID" || { echo "[BLOCKED] Sheets spreadsheet secret is missing."; exit 1; }
          test -n "$SA_JSON_BASE64$GCP_SA_JSON_BASE64" || { echo "[BLOCKED] Sheets service account secret is missing."; exit 1; }

      - name: Apply autonomous Threads loop
        if: env.RUN_AUTONOMOUS_APPLY == 'true'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_X_POST: "false"
          ALLOW_MEDIA_POSTS: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          python3 scripts/run_scheduled_text_slot_pipeline.py \
            --account-id "$ACCOUNT_ID" \
            --slot-id "$CONTENT_SLOT_ID" \
            --use-sheets

      - name: Autonomous health summary
        if: always()
        continue-on-error: true
        run: python3 scripts/check_autonomous_health.py --account-id "$ACCOUNT_ID" --dry-run --use-sheets
