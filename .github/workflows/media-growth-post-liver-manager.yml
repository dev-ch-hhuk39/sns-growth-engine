name: Media Growth Post Liver Manager

on:
  schedule:
    - cron: "4 9 * * *"
  workflow_dispatch:
    inputs:
      confirm_media_post:
        description: "Type true to post one saved approved liver_manager media asset"
        required: true
        default: "false"
      dry_run_only:
        description: "Plan only; never post"
        required: false
        default: "false"
      manual_e2e_proof:
        description: "One-time workflow_dispatch proof without claiming the scheduled slot"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: sns-growth-production-liver-manager-${{ github.ref }}
  cancel-in-progress: false

env:
  ACCOUNT_ID: "liver_manager"
  CONTENT_SLOT_ID: "lm_1800_clip_media"
  PUBLISH_ENABLED: "false"
  ALLOW_REAL_THREADS_POST: "false"
  ALLOW_REAL_THREADS_VIDEO_POST: "false"
  ALLOW_MEDIA_POSTS: "false"
  ALLOW_REAL_X_POST: "false"
  ALLOW_VIDEO_DOWNLOAD: "false"
  ALLOW_VIDEO_CUT: "false"
  ALLOW_CLOUDINARY_UPLOAD: "false"
  ALLOW_TRANSCRIPTION_API: "false"

jobs:
  post-saved-approved-media:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      GCP_SA_JSON_BASE64: ${{ secrets.GCP_SA_JSON_BASE64 || secrets.SA_JSON_BASE64 }}
      SA_JSON_BASE64: ${{ secrets.SA_JSON_BASE64 || secrets.GCP_SA_JSON_BASE64 }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SNS_MASTER_SHEET_ID }}
      SNS_MASTER_SHEET_ID: ${{ secrets.SNS_MASTER_SHEET_ID || secrets.SPREADSHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      THREADS_ACCESS_TOKEN_LIVER_MANAGER: ${{ secrets.THREADS_ACCESS_TOKEN_LIVER_MANAGER }}
      THREADS_USER_ID_LIVER_MANAGER: ${{ secrets.THREADS_USER_ID_LIVER_MANAGER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify triggering revision
        run: |
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Schedule heartbeat
        run: |
          echo "workflow=${{ github.workflow }}"
          echo "event=${{ github.event_name }}"
          echo "account=$ACCOUNT_ID"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Early runtime preflight
        id: preflight
        env:
          MANUAL_CONFIRM: ${{ github.event.inputs.confirm_media_post }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from scheduled_execution_guard import append_job_summary, missing_required_secrets, scheduled_window_decision
          should_publish = os.environ.get("GITHUB_EVENT_NAME") == "schedule" or os.environ.get("MANUAL_CONFIRM") == "true"
          missing = missing_required_secrets(("GEMINI_API_KEY",)) if should_publish else []
          window = scheduled_window_decision(os.environ["CONTENT_SLOT_ID"])
          payload = {"missing_secret_names": missing, "window": window}
          append_job_summary("Scheduled media preflight", payload)
          print(json.dumps(payload, ensure_ascii=False))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"window_allowed={'true' if window.get('status') == 'PASS' else 'false'}\n")
          if missing:
              raise SystemExit("[BLOCKED] required production secret is unavailable: " + ",".join(missing))
          PY

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Dry-run saved media plan
        if: github.event.inputs.manual_e2e_proof != 'true'
        run: python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --post-saved-media --dry-run --use-sheets
      - name: Dry-run manual E2E saved media proof
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.manual_e2e_proof == 'true'
        run: python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --post-saved-media --dry-run --use-sheets
      - name: Create exact WAITING_REVIEW clip queue
        if: ((github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true')) && github.event.inputs.manual_e2e_proof != 'true'
        run: python3 scripts/run_media_production_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --prepare-saved-media-queue --apply --confirm-production-media --use-sheets
      - name: Stop delayed scheduled execution after preserving candidate
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed != 'true'
        run: |
          echo '{"status":"NO_POST","reason":"scheduled_run_out_of_window","candidate_preserved":true}' | tee -a "$GITHUB_STEP_SUMMARY"
          exit 2
      - name: Hybrid review and exact media promotion
        if: ((github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true')) && github.event.inputs.manual_e2e_proof != 'true'
        run: python3 scripts/run_hybrid_ready_pipeline.py --account-id "$ACCOUNT_ID" --slot-id "$CONTENT_SLOT_ID" --max-candidates 1 --approval-mode media --apply --use-sheets --json-output /tmp/hybrid-ready.json
      - name: Resolve scheduled activation gate
        id: activation
        if: github.event_name == 'schedule' && steps.preflight.outputs.window_allowed == 'true'
        run: |
          set +e
          python3 scripts/scheduled_publish_activation_gate.py --use-sheets | tee /tmp/activation-gate.json
          rc=${PIPESTATUS[0]}
          {
            echo "### Runtime activation gate"
            echo '```json'
            cat /tmp/activation-gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
      - name: Check free-tier media budget
        id: media_budget
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.activation.outputs.allowed == 'true')
        run: python3 scripts/check_media_resource_budget.py --use-sheets --apply --confirm-resource-usage --enforce --purpose post
      - name: Guard media post and kill switch
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.activation.outputs.allowed == 'true')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          auto = json.loads(Path("config/autonomous_mode.json").read_text())
          media = json.loads(Path("config/media_growth_engine.json").read_text())
          if auto.get("kill_switch") or not media.get("saved_media_post_enabled"):
              raise SystemExit("[BLOCKED] media post disabled by kill switch or config")
          PY
          for name in SNS_MASTER_SHEET_ID SA_JSON_BASE64 THREADS_ACCESS_TOKEN_LIVER_MANAGER THREADS_USER_ID_LIVER_MANAGER GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then echo "[BLOCKED] required secret is missing: $name"; exit 1; fi
          done
      - name: Post one saved approved media asset
        if: ((github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.dry_run_only != 'true') || (github.event_name == 'schedule' && steps.activation.outputs.allowed == 'true')) && github.event.inputs.manual_e2e_proof != 'true' && steps.media_budget.outcome == 'success'
        env:
          PUBLISH_ENABLED: "true"
          ALLOW_REAL_THREADS_POST: "true"
          ALLOW_REAL_THREADS_VIDEO_POST: "true"
          ALLOW_MEDIA_POSTS: "true"
          ALLOW_REAL_X_POST: "false"
          ALLOW_VIDEO_DOWNLOAD: "false"
          ALLOW_VIDEO_CUT: "false"
          ALLOW_CLOUDINARY_UPLOAD: "false"
          ALLOW_TRANSCRIPTION_API: "false"
        run: |
          qid=$(python3 -c "import json; print(json.load(open('/tmp/hybrid-ready.json')).get('selected_queue_id',''))")
          if [ -z "$qid" ]; then echo "[NO_POST] no AI-approved clip candidate"; exit 2; fi
          python3 scripts/process_threads_queue.py --account-id "$ACCOUNT_ID" --queue-id "$qid" --max-posts 1 --confirm-real-post
      - name: Post one manual E2E saved media proof
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_media_post == 'true' && github.event.inputs.manual_e2e_proof == 'true' && github.event.inputs.dry_run_only != 'true'
        run: |
          echo "[BLOCKED] manual_e2e_proof cannot bypass Hybrid AI"
          exit 1
      - name: Health summary
        if: always()
        continue-on-error: true
        run: python3 scripts/check_autonomous_health.py --account-id "$ACCOUNT_ID" --dry-run --use-sheets
