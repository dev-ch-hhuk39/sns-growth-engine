name: PR 141 Final Contract Self Fix

on:
  push:
    branches:
      - fix/scheduled-autopost-preview-v2

permissions:
  contents: write

jobs:
  patch_test_and_push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout PR 141 branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/scheduled-autopost-preview-v2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-acquisition.txt
            requirements-ci.txt

      - name: Apply final two fixes
        run: python3 scripts/pr141_final_self_fix.py

      - name: Install test dependencies
        run: python3 -m pip install --requirement requirements-acquisition.txt --requirement requirements-ci.txt

      - name: Focused final contracts
        run: |
          python3 -m ruff check --select E9,F63,F7,F82 scripts/hybrid_ai_gate.py scripts/test_scheduled_preview_post_ai_contract.py
          python3 -m compileall -q src scripts
          python3 scripts/test_scheduled_preview_post_ai_contract.py
          python3 scripts/test_hybrid_ai_gate.py
          python3 scripts/test_scheduled_autopost_preview_v2.py
          python3 scripts/test_scheduled_autopost_preview_findings_contract.py
          python3 scripts/test_readiness_and_fail_closed_contract.py

      - name: Full repository regression
        run: python3 scripts/run_repository_tests.py --json-output /tmp/repository-tests.json

      - name: Commit tested fix and remove temporary files
        run: |
          set -euo pipefail
          rm .github/workflows/pr141-final-contract-self-fix.yml
          rm scripts/pr141_final_self_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/hybrid_ai_gate.py scripts/test_scheduled_preview_post_ai_contract.py .github/workflows/pr141-final-contract-self-fix.yml scripts/pr141_final_self_fix.py
          git diff --cached --check
          git commit -m "fix: finalize scheduled AI contracts"
          git push origin HEAD:fix/scheduled-autopost-preview-v2
